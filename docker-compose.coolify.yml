version: "3.8"

services:
  # =============================================================================
  # 🐘 DATABASE (PostgreSQL)
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: fluxbus-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secured_guard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatório}
    volumes:
      - fluxbus-db-data:/var/lib/postgresql/data
    networks:
      - fluxbus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # 🔴 REDIS (Cache & Sessions)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: fluxbus-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD é obrigatório}
    volumes:
      - fluxbus-redis-data:/data
    networks:
      - fluxbus-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # 🔴 REDIS FOR EVOLUTION API
  # =============================================================================
  redis-evolution:
    image: redis:7-alpine
    container_name: fluxbus-redis-evolution
    command: redis-server --appendonly yes
    volumes:
      - fluxbus-redis-evolution-data:/data
    networks:
      - fluxbus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # 📱 EVOLUTION API
  # =============================================================================
  evolution-api:
    image: ghcr.io/zmarioramos/fluxbus-evolution:latest
    container_name: fluxbus-evolution
    environment:
      SERVER_URL: http://localhost:8080
      DATABASE_PROVIDER: sqlite
      DATABASE_CONNECTION_URI: /evolution/store/evolution.db
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}
      CACHE_REDIS_URI: redis://redis-evolution:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: 3600
      WEBHOOK_GLOBAL_ENABLED: false
      WEBHOOK_GLOBAL_URL: ''
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: false
      LOG_LEVEL: INFO
      LOG_COLOR: true
      LOG_BAILEYS: info
      DELAY_INSTANCE_AUTOMATIC_CREATE: 0
      DELAY_INSTANCE_AUTOMATIC_DELETE: 0
    volumes:
      - fluxbus-evolution-instances:/evolution/instances
      - fluxbus-uploads:/evolution/uploads
      - fluxbus-evolution-store:/evolution/store
    networks:
      - fluxbus-network
    depends_on:
      redis-evolution:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # =============================================================================
  # ☕ BACKEND API (Spring Boot Java)
  # =============================================================================
  backend:
    image: ghcr.io/zmarioramos/fluxbus-backend:latest
    container_name: fluxbus-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      
      # Database connection
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-secured_guard}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      
      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # Security (JWT)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET é obrigatório}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      
      # Mail settings
      MAIL_HOST: ${MAIL_HOST:-mail.z7design.com.br}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-securedguard@z7design.com.br}
      
      # WhatsApp settings
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      BAILEYS_ENABLED: ${BAILEYS_ENABLED:-false}
      BAILEYS_REST_URL: http://whatsapp:3333
      BAILEYS_INSTANCE_KEY: ${WHATSAPP_INSTANCE_KEY:-fluxbus}
      EVOLUTION_API_ENABLED: ${EVOLUTION_API_ENABLED:-true}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-B6D711FCDE4D4FD5936544120E713976}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE:-fluxbus}
      
      # App configs
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      N8N_ENABLED: ${N8N_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC}
    volumes:
      - fluxbus-uploads:/app/uploads
      - fluxbus-holerites:/app/holerites
      - fluxbus-logs:/app/logs
    networks:
      - fluxbus-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "coolify.link=https://api.fluxbus.com.br"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # =============================================================================
  # 🎨 FRONTEND VITE (Nginx)
  # =============================================================================
  frontend:
    image: ghcr.io/zmarioramos/fluxbus-frontend:latest
    container_name: fluxbus-frontend
    networks:
      - fluxbus-network
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "coolify.link=https://app.fluxbus.com.br"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

# =============================================================================
# 💾 PERSISTENT VOLUMES
# =============================================================================
volumes:
  fluxbus-db-data:
  fluxbus-redis-data:
  fluxbus-whatsapp-sessions:
  fluxbus-redis-evolution-data:
  fluxbus-evolution-instances:
  fluxbus-evolution-store:
  fluxbus-uploads:
  fluxbus-holerites:
  fluxbus-logs:

# =============================================================================
# 🌐 NETWORKS
# =============================================================================
networks:
  fluxbus-network:
    driver: bridge
