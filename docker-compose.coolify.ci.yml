version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-ci
    environment:
      POSTGRES_DB: ${DB_NAME:-fluxbus_ci}
      POSTGRES_USER: ${DB_USER:-fluxbus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fluxbus123}
    volumes:
      - postgres_ci_data:/var/lib/postgresql/data
    networks:
      - fluxbus_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fluxbus} -d ${DB_NAME:-fluxbus_ci}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-ci
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_ci_data:/data
    networks:
      - fluxbus_ci
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  whatsapp:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/fluxbus-whatsapp:ci
    container_name: whatsapp-ci
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispassword}@redis-ci:6379
    volumes:
      - whatsapp_ci_data:/app/.wwebjs_auth
      - whatsapp_ci_cache:/app/.wwebjs_cache
    networks:
      - fluxbus_ci
    restart: unless-stopped

  # ========================================
  # ASTRACALLS (WhatsApp / whatsmeow)
  # Banco dedicado: 1 database por sessao
  # ========================================
  astracalls-db:
    image: postgres:16-alpine
    container_name: astracalls-db-ci
    environment:
      POSTGRES_DB: ${WACALLS_DB_NAME:-wacalls_main}
      POSTGRES_USER: ${WACALLS_DB_USER:-wacalls}
      POSTGRES_PASSWORD: ${WACALLS_DB_PASSWORD:-wacalls}
    volumes:
      - astracalls_ci_data:/var/lib/postgresql/data
    networks:
      - fluxbus_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WACALLS_DB_USER:-wacalls} -d ${WACALLS_DB_NAME:-wacalls_main}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  astracalls:
    # Imagem buildada pelo workflow CI a partir do fonte atual do AstraCalls
    # (corrige o erro WhatsApp reason="405" / Client Outdated da imagem publicada).
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/fluxbus-astracalls:ci
    container_name: astracalls-ci
    depends_on:
      astracalls-db:
        condition: service_healthy
    environment:
      - WACALLS_API_KEY=${ASTRACALLS_API_KEY:-fluxbus_ci_key}
      - WACALLS_PG_URL=postgres://${WACALLS_DB_USER:-wacalls}:${WACALLS_DB_PASSWORD:-wacalls}@astracalls-db-ci:5432/${WACALLS_DB_NAME:-wacalls_main}?sslmode=disable
      - WACALLS_PG_NAMESPACE=wacalls
      - WACALLS_MAX_CALLS=8
    # O CMD da imagem passa "-db" (SQLite, removido no fork atual);
    # sobrescrevemos com as flags suportadas pelo binario.
    command: ["-addr", ":8080", "-static", "/app/client/dist"]
    expose:
      - 8080
    networks:
      - fluxbus_ci
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/fluxbus-backend:ci
    container_name: backend-ci
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      astracalls:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=ci
      - ASTRACALLS_API_ENABLED=true
      - ASTRACALLS_API_URL=http://astracalls-ci:8080
      - ASTRACALLS_API_KEY=${ASTRACALLS_API_KEY:-fluxbus_ci_key}
      - DB_URL=jdbc:postgresql://postgres-ci:5432/${DB_NAME:-fluxbus_ci}
      - DB_USERNAME=${DB_USER:-fluxbus}
      - DB_PASSWORD=${DB_PASSWORD:-fluxbus123}
      - REDIS_HOST=redis-ci
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - fluxbus_ci
    expose:
      - 8083
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/fluxbus-frontend:ci
    container_name: frontend-ci
    depends_on:
      - backend
    networks:
      - fluxbus_ci
    expose:
      - 80
    restart: unless-stopped

volumes:
  postgres_ci_data:
  redis_ci_data:
  whatsapp_ci_data:
  whatsapp_ci_cache:
  astracalls_ci_data:

networks:
  fluxbus_ci:
    driver: bridge
