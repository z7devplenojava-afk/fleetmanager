version: '3.8'

services:
  # PostgreSQL - Test
  postgres-test:
    image: postgres:15-alpine
    container_name: fluxbus-postgres-test
    environment:
      POSTGRES_DB: fluxbus_test
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    networks:
      - fluxbus-network
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgressg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - Test
  redis-test:
    image: redis:7-alpine
    container_name: fluxbus-redis-test
    volumes:
      - redis_data_test:/data
    networks:
      - fluxbus-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend - Test
  backend-test:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: fluxbus-backend-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/fluxbus_test
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_TEST:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
      SPRING_REDIS_HOST: redis-test
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx1g -Xms512m"
    volumes:
      - backend_logs_test:/app/logs
      - backend_uploads_test:/app/uploads
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - fluxbus-network
    ports:
      - "8083:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend - Test
  frontend-test:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: fluxbus-frontend-test
    environment:
      VITE_API_URL: https://test.z7botsolutions.com.br/api
    depends_on:
      - backend-test
    networks:
      - fluxbus-network
    ports:
      - "3003:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_test:
  redis_data_test:
  backend_logs_test:
  backend_uploads_test:

networks:
  fluxbus-network:
    external: true
    name: fluxbus
