version: '3.8'

services:
  # PostgreSQL - CI
  postgres-ci:
    image: postgres:15-alpine
    container_name: fluxbus-postgres-ci
    environment:
      POSTGRES_DB: fluxbus_ci
      POSTGRES_USER: postgressg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - fluxbus-network
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgressg"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis - CI
  redis-ci:
    image: redis:7-alpine
    container_name: fluxbus-redis-ci
    volumes:
      - redis_data_ci:/data
    networks:
      - fluxbus-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Backend - CI
  backend-ci:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: fluxbus-backend-ci
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/fluxbus_ci
      SPRING_DATASOURCE_USERNAME: postgressg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-S7UGKd%bnKW0!lhBA#BRJLCd!IpXvsnx}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx1g -Xms512m"
      # ===== CONFIGURAÇÃO DE EMAIL (CI / VPS) =====
      # Esses valores são usados pelo profile 'ci' (application-ci.properties)
      MAIL_HOST: mail.z7design.com.br
      MAIL_PORT: 465
      MAIL_USERNAME: securedguard@z7design.com.br
      MAIL_PASSWORD: D8rKeqSFZfaS$(y7
      MAIL_STARTTLS_ENABLE: "false"
      MAIL_STARTTLS_REQUIRED: "false"
      MAIL_SSL_ENABLE: "true"
      MAIL_SOCKET_FACTORY: javax.net.ssl.SSLSocketFactory
      MAIL_SOCKET_FACTORY_PORT: 465
      MAIL_CONNECTION_TIMEOUT: 10000
      MAIL_TIMEOUT: 10000
      MAIL_WRITE_TIMEOUT: 10000
      MAIL_DEBUG: "false"
      # ===== BAILEYS REST (WhatsApp) - CI / VPS =====
      # O backend irá usar essa URL ao invés do default http://whatsapp-service-ci:3333 se necessário
      BAILEYS_REST_URL: http://whatsapp-service-ci:3333
      BAILEYS_ENABLED: "true"
      BAILEYS_INSTANCE_KEY: fluxbus_ci
    volumes:
      - backend_logs_ci:/app/logs
      - backend_uploads_ci:/app/uploads
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - fluxbus-network
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # WhatsApp - Baileys REST (CI / VPS)
  whatsapp-service-ci:
    image: z7design/fluxbus-whatsapp:ci
    container_name: whatsapp-service-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: fluxbus_ci
      SESSION_DIR: /app/sessions
    volumes:
      - whatsapp_sessions_ci:/app/sessions
      - ../backend/holerites:/app/holerites:ro
    networks:
      - fluxbus-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  # Frontend - CI
  frontend-ci:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: fluxbus-frontend-ci
    environment:
      VITE_API_URL: https://ci.z7botsolutions.com.br/api
    depends_on:
      - backend-ci
    networks:
      - fluxbus-network
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx - CI (proxy frontend + backend)
  nginx-ci:
    image: nginx:alpine
    container_name: fluxbus-nginx-ci
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx-ci.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend-ci
      - backend-ci
    networks:
      - fluxbus-network
    restart: unless-stopped

volumes:
  postgres_data_ci:
  redis_data_ci:
  backend_logs_ci:
  backend_uploads_ci:
  whatsapp_sessions_ci:

networks:
  fluxbus-network:
    external: true
    name: fluxbus
