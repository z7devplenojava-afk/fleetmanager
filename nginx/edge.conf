worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Preservar X-Forwarded-Proto enviado pelo Cloudflare (evita ERR_TOO_MANY_REDIRECTS)
    # Cloudflare no modo Flexible envia HTTP ao servidor mas indica https no header
    # Sem este map, $scheme seria sempre 'http' e o Spring/backend tentaria redirecionar para HTTPS
    map $http_x_forwarded_proto $real_proto {
        default   $http_x_forwarded_proto;
        ""        $scheme;
    }

    server {
        listen 80;
        server_name ci.fluxbus.com.br ci.z7botsolutions.com.br;

        location / {
            proxy_pass http://fluxbus-nginx-ci:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }

    server {
        listen 80;
        server_name dev.fluxbus.com.br dev.z7botsolutions.com.br;

        location / {
            proxy_pass http://fluxbus-frontend-dev:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }

    server {
        listen 80;
        server_name fluxbus.com.br www.fluxbus.com.br z7botsolutions.com.br;

        location / {
            proxy_pass http://fluxbus-frontend-prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }
}
