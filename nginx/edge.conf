worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Preservar X-Forwarded-Proto enviado pelo Cloudflare (evita ERR_TOO_MANY_REDIRECTS)
    # Cloudflare no modo Flexible envia HTTP ao servidor mas indica https no header
    # Sem este map, $scheme seria sempre 'http' e o Spring/backend tentaria redirecionar para HTTPS
    map $http_x_forwarded_proto $real_proto {
        default   $http_x_forwarded_proto;
        ""        $scheme;
    }

    # Connection correto para proxy WebSocket: "upgrade" quando o cliente
    # pede Upgrade, vazio caso contrario (evita enviar "upgrade" em requests comuns)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name ci.fluxbus.com.br ci.z7botsolutions.com.br;

        # WebSocket: roteia para o backend com headers de upgrade.
        # Upgrade/Connection sao headers hop-by-hop: sem este bloco, o nginx da borda
        # descarta o header Upgrade e o Tomcat responde 400
        location /ws {
            proxy_pass http://fluxbus-nginx-ci:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://fluxbus-nginx-ci:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }

    server {
        listen 80;
        server_name dev.fluxbus.com.br dev.z7botsolutions.com.br;

        # API: roteia para o backend diretamente
        location /api/ {
            proxy_pass http://fluxbus-backend-dev:8083/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # WebSocket: roteia para o backend
        location /ws {
            proxy_pass http://fluxbus-backend-dev:8083/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Frontend: SPA + assets estáticos
        location / {
            proxy_pass http://fluxbus-frontend-dev:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }

    server {
        listen 80;
        server_name fluxbus.com.br www.fluxbus.com.br z7botsolutions.com.br;

        # API: roteia para o backend diretamente
        location /api/ {
            proxy_pass http://fluxbus-backend-prod:8083/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # WebSocket: roteia para o backend
        location /ws {
            proxy_pass http://fluxbus-backend-prod:8083/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # Frontend: SPA + assets estáticos
        location / {
            proxy_pass http://fluxbus-frontend-prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_proto;
        }
    }
}
