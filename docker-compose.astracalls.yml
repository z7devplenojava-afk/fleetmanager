# ============================================
# ASTRACALLS - WHATSAPP (AMBIENTE LOCAL)
# Nomenclatura: fluxbus-local-astracalls-*
# Uso: docker compose -f docker-compose.astracalls.yml up -d
#
# API em http://localhost:8090 (rotas /api/* exigem header X-API-Key)
# Backend (gradlew bootRun) aponta para http://localhost:8090
# ============================================

services:
  # ==========================================
  # POSTGRESQL - Persistencia do AstraCalls
  # (1 banco principal + 1 banco por sessao)
  # ==========================================
  astracalls-db:
    image: postgres:16-alpine
    container_name: fluxbus-local-astracalls-db
    hostname: astracalls-db
    environment:
      POSTGRES_DB: wacalls_main
      POSTGRES_USER: wacalls
      POSTGRES_PASSWORD: wacalls
    volumes:
      - fluxbus-local-astracalls-db-data:/var/lib/postgresql/data
    networks:
      - fluxbus-astracalls-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wacalls -d wacalls_main"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================
  # ASTRACALLS - API WhatsApp (whatsmeow)
  # ==========================================
  astracalls:
    # Imagem buildada localmente a partir de https://github.com/AstraOnlineWeb/AstraCalls
    # (fonte atual com whatsmeow de nov/2026). Necessario para corrigir o erro
    # WhatsApp reason="405" (Client Outdated) que a imagem publicada apresentava.
    image: fluxbus/astracalls:local
    container_name: fluxbus-local-astracalls
    hostname: astracalls
    environment:
      WACALLS_API_KEY: fluxbus_local_key
      WACALLS_PG_URL: postgres://wacalls:wacalls@astracalls-db:5432/wacalls_main?sslmode=disable
      WACALLS_PG_NAMESPACE: wacalls
      WACALLS_MAX_CALLS: "8"
    # O CMD da imagem ainda passa "-db" (SQLite, removido no fork atual);
    # sobrescrevemos com as flags suportadas pelo binario.
    command: ["-addr", ":8080", "-static", "/app/client/dist"]
    ports:
      - "8090:8080"
    networks:
      - fluxbus-astracalls-network
    depends_on:
      astracalls-db:
        condition: service_healthy
    restart: unless-stopped

# ============================================
# VOLUMES
# ============================================
volumes:
  fluxbus-local-astracalls-db-data:
    name: fluxbus-local-astracalls-db-data

# ============================================
# NETWORKS
# ============================================
networks:
  fluxbus-astracalls-network:
    name: fluxbus-astracalls-network
    driver: bridge
