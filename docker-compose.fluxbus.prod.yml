version: '3.8'

# ========================================
# DOCKER COMPOSE PARA WWW.FLUXBUS.COM.BR
# ========================================

services:
  # ========================================
  # DATABASE PROD
  # ========================================
  postgres-prod:
    image: postgres:15-alpine
    container_name: fluxbus-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PROD:-fluxbus_db_prod}
      POSTGRES_USER: ${POSTGRES_USER_PROD:-fluxbus_user_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:-prodpass123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - fluxbus-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_PROD:-fluxbus_user_prod} -d ${POSTGRES_DB_PROD:-fluxbus_db_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE PROD
  # ========================================
  redis-prod:
    image: redis:7-alpine
    container_name: fluxbus-redis-prod
    ports:
      - "6381:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - fluxbus-prod-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD_PROD:-prodredispass}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD_PROD:-prodredispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API PROD
  # ========================================
  backend-prod:
    image: z7design/fluxbus-backend:prod
    container_name: fluxbus-backend-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Porta interna fixa em 8083 (mesma do perfil prod — explícito para consistência com dev/ci)
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres-prod:5432/${POSTGRES_DB_PROD:-fluxbus_db_prod}
      DB_USERNAME: ${POSTGRES_USER_PROD:-fluxbus_user_prod}
      DB_PASSWORD: ${POSTGRES_PASSWORD_PROD:-prodpass123}
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD_PROD:-prodredispass}
      JWT_SECRET: ${JWT_SECRET_PROD:-prodjwtsecret1234567890123456789012}
      # Email Configuration
      MAIL_HOST: ${MAIL_HOST:-186.209.113.105}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-securedguard@z7design.com.br}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-D8rKeqSFZfaS$(y7}
      MAIL_SSL_ENABLE: true
      # JVM Memory Optimization (evita OOM Killer na VPS)
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseG1GC -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom"
      # WhatsApp Configuration (Evolution API)
      EVOLUTION_API_URL: http://evolution-api-prod:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY_PROD:-B6D711FCDE4D4FD5936544120E713976}
      EVOLUTION_API_INSTANCE: ${EVOLUTION_API_INSTANCE_PROD:-fluxbus_prod}
      EVOLUTION_API_ENABLED: "true"
    ports:
      - "8085:8083"
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - fluxbus-prod-network
      - z7network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8083/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    restart: unless-stopped

  # ========================================
  # WHATSAPP SERVICE (Evolution API) PROD
  # ========================================
  evolution-api-prod:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: fluxbus-evolution-api-prod
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY_PROD:-B6D711FCDE4D4FD5936544120E713976}
      - CONFIG_SESSION_PHONE_CLIENT=FluxBus
      - CONFIG_SESSION_PHONE_NAME=chrome
      - QRCODE_LIMIT=30
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - TYPEBOT_ENABLED=false
      - CHATWOOT_ENABLED=false
      - RABBITMQ_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=ERROR,WARN,INFO
    ports:
      # Porta 8088 para evitar conflito com fluxbus-nginx-ci (que usa 8082)
      - "8088:8080"
    volumes:
      - evolution_instances_prod:/evolution/instances
    networks:
      - fluxbus-prod-network
    restart: unless-stopped

  # ========================================
  # FRONTEND PROD
  # ========================================
  frontend-prod:
    image: z7design/fluxbus-frontend:prod
    container_name: fluxbus-frontend-prod
    ports:
      - "82:80"
    depends_on:
      backend-prod:
        condition: service_started
    networks:
      - fluxbus-prod-network
      - z7network
    healthcheck:
      # 127.0.0.1: localhost resolve ::1 (IPv6) e o nginx escuta so IPv4 -> wget busybox nao faz fallback
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# ========================================
# VOLUMES PROD
# ========================================
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  evolution_instances_prod:
    driver: local

# ========================================
# NETWORKS PROD
# ========================================
networks:
  fluxbus-prod-network:
    driver: bridge
    name: fluxbus-prod
  z7network:
    external: true
    name: z7network

