name: 🚀 Deploy Fluxbus to Coolify (GHCR Build & Push)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 🐳 Build & Push Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: 📦 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏷️ Set downcase owner name
        id: repo_owner
        run: |
          echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------
      # 1. BUILD & PUSH WHATSAPP SERVICE
      # ----------------------------------------------------
      - name: 📱 Build & Push WhatsApp Service
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fluxbus-whatsapp:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fluxbus-whatsapp:${{ github.sha }}

      # ----------------------------------------------------
      # 2. BUILD & PUSH BACKEND API
      # ----------------------------------------------------
      - name: 🔨 Build & Push Backend API
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fluxbus-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fluxbus-backend:${{ github.sha }}

      # ----------------------------------------------------
      # 3. BUILD & PUSH FRONTEND (Vite)
      # ----------------------------------------------------
      - name: 🎨 Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=https://api.fluxbus.com.br/api
            VITE_WS_URL=wss://api.fluxbus.com.br/ws
            VITE_ENVIRONMENT=production
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fluxbus-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/fluxbus-frontend:${{ github.sha }}

      # ----------------------------------------------------
      # 4. TRIGGER COOLIFY REDEPLOY
      # ----------------------------------------------------
      - name: 🚀 Trigger Coolify Redeploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "⚠️ COOLIFY_WEBHOOK não configurado — pulando o webhook."
            exit 0
          fi
          echo "🔄 Disparando Webhook de Deploy do Coolify..."
          curl -i -X GET "$COOLIFY_WEBHOOK"
