# DESABILITADO: Substituido por pipeline-ci-dev-prod.yml
# Este workflow antigo foi substituido pelo pipeline sequencial.
# Use pipeline-ci-dev-prod.yml que faz CI -> DEV -> PROD automaticamente.
on:
  workflow_dispatch:

concurrency:
  group: deploy-ci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_CI }}
          username: ${{ secrets.VPS_USER_CI }}
          password: ${{ secrets.VPS_PASSWORD_CI }}
          port: ${{ secrets.VPS_SSH_PORT_CI || 22 }}
          script: |
            set -e
            APP_PATH="${{ secrets.VPS_APP_PATH_CI }}"
            if [ -z "$APP_PATH" ]; then APP_PATH="/var/www/fluxbus"; fi
            cd "$APP_PATH"
            git pull https://${{ secrets.USER_GITHUB }}:${{ secrets.TOKEN_GITHUB }}@github.com/jmr337778-crypto/fleetmanager.git ci
            cd deploy
            docker-compose -f docker-compose.env-ci.yml build --no-cache backend-ci frontend-ci
            docker-compose -f docker-compose.env-ci.yml up -d --force-recreate
