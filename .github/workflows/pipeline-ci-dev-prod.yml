name: "🚀 Pipeline Sequencial CI → DEV → PROD"

# ============================================================
# DISPARO: push na branch ci
# FLUXO:   build-and-push -> deploy-ci -> health-ci
#          -> deploy-dev -> health-dev
#          -> deploy-prod -> health-prod
# Se qualquer etapa falhar, as proximas NAO executam.
# ============================================================

on:
  push:
    branches:
      - ci
  workflow_dispatch:
    inputs:
      start_from:
        description: 'Iniciar a partir de qual ambiente'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - dev
          - prod

concurrency:
  group: deploy-ci
  cancel-in-progress: false

env:
  CI_URL:   https://ci.fluxbus.com.br
  DEV_URL:  https://dev.fluxbus.com.br
  PROD_URL: https://fluxbus.com.br

jobs:
  # ============================================================
  # JOB 1: BUILD E PUSH DAS IMAGENS DOCKER (tag :ci)
  # ============================================================
  build-and-push:
    name: "🔨 Build & Push Imagens (tag ci)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: "${{ github.event.inputs.start_from == '' || github.event.inputs.start_from == 'ci' }}"

    steps:
      - name: "📥 Checkout branch ci"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle
          cache-dependency-path: backend/build.gradle

      - name: "📦 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "🔨 Build Backend (Gradle)"
        working-directory: ./backend
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Tentativa $attempt..."
            ./gradlew clean bootJar -x test --no-daemon && break || {
              [ $attempt -lt 3 ] && sleep 10 || { echo "Build falhou!"; exit 1; }
            }
          done
          ls -lh build/libs/*.jar

      - name: "🎨 Build Frontend (Vite)"
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_API_URL: ${{ env.CI_URL }}/api
          VITE_WS_URL: wss://ci.fluxbus.com.br/ws
          VITE_ENVIRONMENT: ci
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --force --no-audit --no-fund
          npm install --no-save --legacy-peer-deps @rollup/rollup-linux-x64-gnu
          npm run build

      - name: "🔐 Login no Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🐳 Build & Push Backend :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-backend:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/z7devplenojava-afk/fleetmanager

      - name: "🐳 Build & Push Frontend :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-frontend:ci
          build-args: |
            VITE_API_URL=${{ env.CI_URL }}/api
            VITE_WS_URL=wss://ci.fluxbus.com.br/ws
            VITE_ENVIRONMENT=ci

      - name: "🐳 Build & Push WhatsApp :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: true
          tags: z7design/fluxbus-whatsapp:ci

  # ============================================================
  # JOB 2: DEPLOY CI
  # ============================================================
  deploy-ci:
    name: "🧪 Deploy CI"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ci
      url: ${{ env.CI_URL }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "🔑 Instalar sshpass"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_CI }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "📤 Transferir arquivos para VPS CI"
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} \
            "mkdir -p /var/www/fluxbus/ci/nginx /var/www/fluxbus/ci/uploads /var/www/fluxbus/uploads /var/www/fluxbus/traefik/dynamic && rm -rf /var/www/secured_guard"
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS docker-compose.ci.yml \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/ci/
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS nginx/ci.conf \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/ci/nginx/
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS traefik-dynamic-ci.yml \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/traefik/dynamic/ci.yml
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} "docker restart traefik 2>/dev/null || true"

      - name: "⚙️ Criar .env CI e subir containers"
        run: |
          JWT="${{ secrets.JWT_SECRET_CI }}"
          [ -z "$JWT" ] && JWT="CHANGE_THIS_JWT_SECRET"
          {
            printf 'POSTGRES_DB_CI=fluxbus_db_ci\n'
            printf 'POSTGRES_USER_CI=fluxbus_user_ci\n'
            printf 'POSTGRES_PASSWORD_CI=%s\n' "${{ secrets.POSTGRES_PASSWORD_CI  }}"
            printf 'REDIS_PASSWORD_CI=%s\n'    "${{ secrets.REDIS_PASSWORD_CI  }}"
            printf 'JWT_SECRET_CI=%s\n'        "$JWT"
            printf 'MAIL_HOST=%s\n'            "${{ secrets.MAIL_HOST || 'mail.z7design.com.br' }}"
            printf 'MAIL_PORT=%s\n'            "${{ secrets.MAIL_PORT || '465' }}"
            printf 'MAIL_USERNAME=%s\n'        "${{ secrets.MAIL_USERNAME || 'securedguard@z7design.com.br' }}"
            printf 'MAIL_PASSWORD=%s\n'        "${{ secrets.MAIL_PASSWORD }}"
            printf 'MAIL_SSL_ENABLE=true\n'
            printf 'BAILEYS_REST_URL=%s\n'     "${{ secrets.BAILEYS_REST_URL || 'http://whatsapp-service-ci:3333' }}"
            printf 'BAILEYS_ENABLED=%s\n'      "${{ secrets.BAILEYS_ENABLED || 'true' }}"
            printf 'BAILEYS_INSTANCE_KEY=%s\n' "fluxbus_ci"
            printf 'EVOLUTION_API_KEY=%s\n'     "${{ secrets.EVOLUTION_API_KEY || 'fluxbus_ci_key' }}"
            printf 'EVOLUTION_API_URL=%s\n'     "http://whatsapp-service-ci:3333"
          } > /tmp/ci.env
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            /tmp/ci.env ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/ci/.env
          rm -f /tmp/ci.env

      - name: "🚀 Subir containers CI"
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} << 'SSHEOF'
              set -e
              # Parar e remover qualquer container legado do secured_guard
              docker stop secured-guard-db-ci secured-guard-redis-ci secured-guard-backend-ci secured-guard-frontend-ci secured-guard-whatsapp-ci secured-guard-nginx-ci secured-guard-evolution-ci 2>/dev/null || true
              docker rm secured-guard-db-ci secured-guard-redis-ci secured-guard-backend-ci secured-guard-frontend-ci secured-guard-whatsapp-ci secured-guard-nginx-ci secured-guard-evolution-ci 2>/dev/null || true
              rm -rf /var/www/secured_guard 2>/dev/null || true

              # Remover containers orfaos de nomes fixos (conflito de container_name)
              docker rm -f fluxbus-nginx-ci fluxbus-db-ci fluxbus-redis-ci fluxbus-backend-ci fluxbus-frontend-ci fluxbus-whatsapp-ci whatsapp-service-ci 2>/dev/null || true

              # Derrubar stack legado antigo (compose renomeado em /var/www/fluxbus)
              if [ -f /var/www/fluxbus/docker-compose.yml ]; then
                (cd /var/www/fluxbus && docker compose down --remove-orphans) 2>/dev/null || true
              fi

              cd /var/www/fluxbus/ci
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
              docker network create z7network 2>/dev/null || true
              docker compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
              for i in 1 2 3; do
                docker pull z7design/fluxbus-backend:ci && \
                docker pull z7design/fluxbus-frontend:ci && \
                docker pull z7design/fluxbus-whatsapp:ci && break || sleep 15
              done
              docker compose -f docker-compose.ci.yml up -d --force-recreate --remove-orphans || {
                echo "❌ Falha ao subir containers no CI. Logs do backend:"
                docker logs fluxbus-backend-ci --tail 100 || true
                echo "Logs do frontend:"
                docker logs fluxbus-frontend-ci --tail 50 || true
                exit 1
              }
              docker compose -f docker-compose.ci.yml ps
          SSHEOF

  # ============================================================
  # JOB 3: HEALTH CHECK CI
  # ============================================================
  health-ci:
    name: "🏥 Health Check CI"
    needs: deploy-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "⏳ Aguardar inicializacao (90s)"
        run: sleep 90

      - name: "🔍 Verificar saude CI"
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.CI_URL }}/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "CI saudavel!"; exit 0; }
            sleep 15
          done
          echo "Health check CI falhou"
          exit 1

  # ============================================================
  # JOB 4: DEPLOY DEV (so roda se CI passou)
  # ============================================================
  deploy-dev:
    name: "🔧 Deploy DEV"
    needs: health-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ env.DEV_URL }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "🔐 Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🐳 Re-tag CI -> DEV e push"
        run: |
          docker pull z7design/fluxbus-backend:ci
          docker pull z7design/fluxbus-frontend:ci
          docker pull z7design/fluxbus-whatsapp:ci
          docker tag z7design/fluxbus-backend:ci  z7design/fluxbus-backend:dev
          docker tag z7design/fluxbus-frontend:ci z7design/fluxbus-frontend:dev
          docker tag z7design/fluxbus-whatsapp:ci z7design/fluxbus-whatsapp:dev
          docker push z7design/fluxbus-backend:dev
          docker push z7design/fluxbus-frontend:dev
          docker push z7design/fluxbus-whatsapp:dev

      - name: "🔑 Instalar sshpass"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: "⚙️ Criar .env DEV e subir containers"
        run: |
          JWT="${{ secrets.JWT_SECRET_DEV }}"
          [ -z "$JWT" ] && JWT="jwt_secret_dev_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algo"
          {
            printf 'POSTGRES_DB_DEV=fluxbus_db_dev\n'
            printf 'POSTGRES_USER_DEV=fluxbus_user_dev\n'
            printf 'POSTGRES_PASSWORD_DEV=%s\n' "${{ secrets.POSTGRES_PASSWORD_DEV || 'devpass123' }}"
            printf 'REDIS_PASSWORD_DEV=%s\n'    "${{ secrets.REDIS_PASSWORD_DEV || 'devredispass' }}"
            printf 'JWT_SECRET_DEV=%s\n'        "$JWT"
            printf 'MAIL_HOST=mail.z7design.com.br\n'
            printf 'MAIL_PORT=465\n'
            printf 'MAIL_USERNAME=securedguard@z7design.com.br\n'
            printf 'MAIL_PASSWORD=%s\n'        "${{ secrets.MAIL_PASSWORD }}"
            printf 'MAIL_SSL_ENABLE=true\n'
          } > /tmp/dev.env

          HOST="${{ secrets.VPS_HOST_DEV || secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER_DEV || secrets.VPS_USER }}"
          PASS="${{ secrets.VPS_PASSWORD_DEV || secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"

          sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST "mkdir -p /var/www/fluxbus/dev /var/www/fluxbus/traefik/dynamic"
          sshpass -p "$PASS" scp $SSH_OPTS docker-compose.fluxbus.dev.yml $USER@$HOST:/var/www/fluxbus/dev/docker-compose.yml
          sshpass -p "$PASS" scp $SSH_OPTS traefik-dynamic-dev.yml $USER@$HOST:/var/www/fluxbus/traefik/dynamic/dev.yml
          sshpass -p "$PASS" scp $SSH_OPTS /tmp/dev.env $USER@$HOST:/var/www/fluxbus/dev/.env
          rm -f /tmp/dev.env

          sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST << 'SSHEOF'
            set -e
            mkdir -p /var/www/fluxbus/dev
            rm -rf /var/www/secured_guard 2>/dev/null || true
            cd /var/www/fluxbus/dev
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker compose pull
            docker compose down
            docker compose up -d
            docker compose ps
          SSHEOF

  # ============================================================
  # JOB 5: HEALTH CHECK DEV
  # ============================================================
  health-dev:
    name: "🏥 Health Check DEV"
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "⏳ Aguardar inicializacao (2 min)"
        run: sleep 120

      - name: "🔍 Verificar saude DEV"
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.DEV_URL }}/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "DEV saudavel!"; exit 0; }
            sleep 15
          done
          echo "Health check DEV falhou"
          exit 1

  # ============================================================
  # JOB 6: DEPLOY PROD (so roda se DEV passou)
  # ============================================================
  deploy-prod:
    name: "🌟 Deploy PROD"
    needs: health-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ env.PROD_URL }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "🔐 Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🐳 Re-tag CI -> PROD e push"
        run: |
          docker pull z7design/fluxbus-backend:ci
          docker pull z7design/fluxbus-frontend:ci
          docker pull z7design/fluxbus-whatsapp:ci
          docker tag z7design/fluxbus-backend:ci  z7design/fluxbus-backend:prod
          docker tag z7design/fluxbus-frontend:ci z7design/fluxbus-frontend:prod
          docker tag z7design/fluxbus-whatsapp:ci z7design/fluxbus-whatsapp:prod
          docker push z7design/fluxbus-backend:prod
          docker push z7design/fluxbus-frontend:prod
          docker push z7design/fluxbus-whatsapp:prod

      - name: "🔑 Instalar sshpass"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: "⚙️ Criar .env PROD e subir containers"
        run: |
          JWT="${{ secrets.JWT_SECRET_PROD }}"
          [ -z "$JWT" ] && JWT="jwt_secret_prod_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algo"
          {
            printf 'POSTGRES_DB_PROD=fluxbus_db_prod\n'
            printf 'POSTGRES_USER_PROD=fluxbus_user_prod\n'
            printf 'POSTGRES_PASSWORD_PROD=%s\n' "${{ secrets.POSTGRES_PASSWORD_PROD || 'prodpass123' }}"
            printf 'REDIS_PASSWORD_PROD=%s\n'    "${{ secrets.REDIS_PASSWORD_PROD || 'prodredispass' }}"
            printf 'JWT_SECRET_PROD=%s\n'        "$JWT"
            printf 'MAIL_HOST=mail.z7design.com.br\n'
            printf 'MAIL_PORT=465\n'
            printf 'MAIL_USERNAME=securedguard@z7design.com.br\n'
            printf 'MAIL_PASSWORD=%s\n'        "${{ secrets.MAIL_PASSWORD }}"
            printf 'MAIL_SSL_ENABLE=true\n'
            printf 'EVOLUTION_API_KEY_PROD=%s\n' "${{ secrets.EVOLUTION_API_KEY_PROD  }}"
            printf 'EVOLUTION_API_INSTANCE_PROD=fluxbus_prod\n'
          } > /tmp/prod.env

          HOST="${{ secrets.VPS_HOST_PROD || secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER_PROD || secrets.VPS_USER }}"
          PASS="${{ secrets.VPS_PASSWORD_PROD || secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"

          sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST "mkdir -p /var/www/fluxbus/prod /var/www/fluxbus/traefik/dynamic"
          sshpass -p "$PASS" scp $SSH_OPTS docker-compose.fluxbus.prod.yml $USER@$HOST:/var/www/fluxbus/prod/docker-compose.yml
          sshpass -p "$PASS" scp $SSH_OPTS traefik-dynamic-prod.yml $USER@$HOST:/var/www/fluxbus/traefik/dynamic/prod.yml
          sshpass -p "$PASS" scp $SSH_OPTS /tmp/prod.env $USER@$HOST:/var/www/fluxbus/prod/.env
          rm -f /tmp/prod.env

          sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST << 'SSHEOF'
            set -e
            mkdir -p /var/www/fluxbus/prod
            rm -rf /var/www/secured_guard 2>/dev/null || true
            cd /var/www/fluxbus/prod
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker tag z7design/fluxbus-backend:prod z7design/fluxbus-backend:backup-$(date +%Y%m%d-%H%M%S) 2>/dev/null || true
            docker compose pull
            docker compose down --remove-orphans || true
            docker compose up -d --force-recreate --remove-orphans || {
              echo "❌ Falha ao subir containers no PROD. Logs do backend:"
              docker logs fluxbus-backend-prod --tail 100 || true
              echo "Logs da Evolution API:"
              docker logs fluxbus-evolution-api-prod --tail 50 || true
              exit 1
            }
            docker compose ps
            docker restart traefik 2>/dev/null || true
          SSHEOF

  # ============================================================
  # JOB 7: HEALTH CHECK PROD + RELATORIO FINAL
  # ============================================================
  health-prod:
    name: "🏥 Health Check PROD"
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "⏳ Aguardar inicializacao (2 min)"
        run: sleep 120

      - name: "🔍 Verificar saude PROD"
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.PROD_URL }}/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "PROD saudavel!"; exit 0; }
            sleep 15
          done
          echo "Health check PROD falhou"
          exit 1

      - name: "🎉 Pipeline concluido com sucesso"
        if: success()
        run: |
          echo "=================================================="
          echo "PIPELINE CI->DEV->PROD CONCLUIDO!"
          echo "SHA: ${{ github.sha }}"
          echo "Hora: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "CI   -> ${{ env.CI_URL }}"
          echo "DEV  -> ${{ env.DEV_URL }}"
          echo "PROD -> ${{ env.PROD_URL }}"
          echo "=================================================="
