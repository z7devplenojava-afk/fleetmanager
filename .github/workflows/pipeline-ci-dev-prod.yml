name: "🚀 Pipeline Sequencial CI → DEV → PROD"

# ============================================================
# DISPARO: push na branch ci
# FLUXO:   build-and-push -> deploy-ci -> health-ci
#          -> deploy-dev -> health-dev
#          -> deploy-prod -> health-prod
# Se qualquer etapa falhar, as proximas NAO executam.
# ============================================================

on:
  push:
    branches:
      - ci
  workflow_dispatch:
    inputs:
      start_from:
        description: 'Iniciar a partir de qual ambiente'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - dev
          - prod

concurrency:
  group: deploy-ci
  cancel-in-progress: false

env:
  CI_URL:   https://ci.fluxbus.com.br
  DEV_URL:  https://dev.fluxbus.com.br
  PROD_URL: https://fluxbus.com.br

jobs:
  # ============================================================
  # JOB 1: BUILD E PUSH DAS IMAGENS DOCKER (tag :ci)
  # ============================================================
  build-and-push:
    name: "🔨 Build & Push Imagens (tag ci)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: "${{ github.event.inputs.start_from == '' || github.event.inputs.start_from == 'ci' }}"

    steps:
      - name: "📥 Checkout branch ci"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "☕ Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle
          cache-dependency-path: backend/build.gradle

      - name: "📦 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "🔨 Build Backend (Gradle)"
        working-directory: ./backend
        timeout-minutes: 20
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Tentativa $attempt..."
            ./gradlew clean bootJar -x test --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC" && break || {
              [ $attempt -lt 3 ] && sleep 10 || { echo "Build falhou!"; exit 1; }
            }
          done
          ls -lh build/libs/*.jar

      - name: "🎨 Build Frontend (Vite)"
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_API_URL: ${{ env.CI_URL }}/api
          VITE_WS_URL: wss://ci.z7botsolutions.com.br/ws
          VITE_ENVIRONMENT: ci
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --force --no-audit --no-fund
          npm install --no-save --legacy-peer-deps @rollup/rollup-linux-x64-gnu
          npm run build

      - name: "🔐 Login no Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🐳 Build & Push Backend :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-backend:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/z7devplenojava-afk/fleetmanager

      - name: "🐳 Build & Push Frontend :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-frontend:ci
          build-args: |
            VITE_API_URL=${{ env.CI_URL }}/api
            VITE_WS_URL=wss://ci.z7botsolutions.com.br/ws
            VITE_ENVIRONMENT: ci

      - name: "🐳 Build & Push WhatsApp :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: true
          tags: z7design/fluxbus-whatsapp:ci

      - name: "📥 Clone AstraCalls (fonte atual)"
        run: |
          git clone --depth 1 https://github.com/AstraOnlineWeb/AstraCalls.git .astracalls-src

      - name: "🐳 Build & Push AstraCalls :ci"
        uses: docker/build-push-action@v5
        with:
          context: ./.astracalls-src
          push: true
          build-args: |
            BUILD_VERSION=ci
            BUILD_REV=${{ github.sha }}
          tags: z7design/fluxbus-astracalls:ci

  # ============================================================
  # JOB 2: DEPLOY CI
  # ============================================================
  deploy-ci:
    name: "🧪 Deploy CI"
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ci
      url: ${{ env.CI_URL }}

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "🔑 Instalar sshpass"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST_CI }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: "📤 Transferir arquivos para VPS CI"
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"
          
          run_ssh() {
            local max_attempts=3
            local attempt=1
            until sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS "${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}" "$@"; do
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Falha definitiva após $attempt tentativas de SSH no CI."
                return 1
              fi
              echo "⚠️ Tentativa $attempt de SSH falhou (possível timeout/sobrecarga na VPS). Aguardando 15s para nova tentativa..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          run_scp() {
            local max_attempts=3
            local attempt=1
            until sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS "$@"; do
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Falha definitiva após $attempt tentativas de SCP no CI."
                return 1
              fi
              echo "⚠️ Tentativa $attempt de SCP falhou. Aguardando 15s para nova tentativa..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          run_ssh "journalctl --vacuum-size=50M 2>/dev/null || true; rm -rf /tmp/* 2>/dev/null || true; mkdir -p /var/www/fluxbus/ci/nginx /var/www/fluxbus/ci/uploads /var/www/fluxbus/uploads /var/www/fluxbus/traefik/dynamic && rm -rf /var/www/secured_guard"
          run_scp docker-compose.ci.yml "${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/ci/"
          run_scp nginx/ci.conf "${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/ci/nginx/"
          run_scp traefik-dynamic-ci.yml "${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/traefik/dynamic/ci.yml"
          run_ssh "docker restart traefik 2>/dev/null || true"

      - name: "⚙️ Criar .env CI e subir containers"
        run: |
          JWT="${{ secrets.JWT_SECRET_CI }}"
          [ -z "$JWT" ] && JWT="CHANGE_THIS_JWT_SECRET"
          {
            printf 'POSTGRES_DB_CI=fluxbus_db_ci\n'
            printf 'POSTGRES_USER_CI=fluxbus_user_ci\n'
            printf 'POSTGRES_PASSWORD_CI=%s\n' "${{ secrets.POSTGRES_PASSWORD_CI  }}"
            printf 'REDIS_PASSWORD_CI=%s\n'    "${{ secrets.REDIS_PASSWORD_CI  }}"
            printf 'JWT_SECRET_CI=%s\n'        "$JWT"
            printf 'MAIL_HOST=%s\n'            "${{ secrets.MAIL_HOST || 'mail.z7design.com.br' }}"
            printf 'MAIL_PORT=%s\n'            "${{ secrets.MAIL_PORT || '465' }}"
            printf 'MAIL_USERNAME=%s\n'        "${{ secrets.MAIL_USERNAME || 'securedguard@z7design.com.br' }}"
            printf 'MAIL_PASSWORD=%s\n'        "${{ secrets.MAIL_PASSWORD }}"
            printf 'MAIL_SSL_ENABLE=true\n'
            printf 'BAILEYS_REST_URL=%s\n'     "${{ secrets.BAILEYS_REST_URL || 'http://whatsapp-service-ci:3333' }}"
            printf 'BAILEYS_ENABLED=%s\n'      "${{ secrets.BAILEYS_ENABLED || 'true' }}"
            printf 'BAILEYS_INSTANCE_KEY=%s\n' "fluxbus_ci"
            printf 'EVOLUTION_API_KEY=%s\n'     "${{ secrets.EVOLUTION_API_KEY || 'fluxbus_ci_key' }}"
            printf 'EVOLUTION_API_URL=%s\n'     "http://whatsapp-service-ci:3333"
            printf 'ASTRACALLS_API_ENABLED=true\n'
            printf 'ASTRACALLS_API_URL=http://astracalls-ci:8080\n'
            printf 'ASTRACALLS_API_KEY=%s\n'    "${{ secrets.ASTRACALLS_API_KEY || 'fluxbus_ci_key' }}"
          } > /tmp/ci.env

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60"
          for i in 1 2 3; do
            if sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" scp $SSH_OPTS /tmp/ci.env "${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }}:/var/www/fluxbus/ci/.env"; then
              break
            fi
            echo "⚠️ Tentativa $i de envio do .env falhou. Aguardando 15s..."
            sleep 15
          done
          rm -f /tmp/ci.env

      - name: "🚀 Subir containers CI"
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"
          for attempt in 1 2 3; do
            echo "🚀 Conectando ao VPS CI para subir containers (Tentativa $attempt)..."
            if sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS \
              ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} "DOCKER_USER='${{ secrets.DOCKER_USERNAME }}' DOCKER_PASS='${{ secrets.DOCKER_PASSWORD }}' bash -s" < .github/scripts/deploy-ci.sh; then
              echo "✅ Containers CI iniciados com sucesso!"
              break
            else
              if [ $attempt -ge 3 ]; then
                echo "❌ Falha definitiva ao subir containers CI após 3 tentativas."
                exit 1
              fi
              echo "⚠️ Tentativa $attempt de subir containers CI falhou. Aguardando 15s antes de retentar..."
              sleep 15
            fi
          done

      - name: "🧹 Purpar cache Cloudflare do CI (sw.js)"
        # Cloudflare pode manter um sw.js antigo por 1 ano (Cache-Control: immutable),
        # fazendo o navegador registrar Workbox antigo e falhar com "didn't register its module".
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          ZONE="${{ secrets.CLOUDFLARE_ZONE_ID }}"
          if [ -z "$ZONE" ]; then
            ZONE=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://api.cloudflare.com/client/v4/zones?name=fluxbus.com.br&status=active" \
              | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ZONE" ]; then
            echo "⚠️ Zona Cloudflare não encontrada; purge ignorado"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            --data '{"files":["https://ci.fluxbus.com.br/sw.js","https://ci.fluxbus.com.br/registerSW.js","https://ci.fluxbus.com.br/manifest.webmanifest"]}'
          echo "✅ Cache do Service Worker purgado"

  # ============================================================
  # JOB 3: HEALTH CHECK CI
  # ============================================================
  health-ci:
    name: "🏥 Health Check CI"
    needs: deploy-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "⏳ Aguardar inicializacao (90s)"
        run: sleep 90

      - name: "🔍 Verificar saude CI"
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.CI_URL }}/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "CI saudavel!"; exit 0; }
            sleep 15
          done
          echo "Health check CI falhou"
          exit 1

      - name: "📋 Exibir logs do container em caso de falha"
        if: failure()
        run: |
          sudo apt-get update -q && sudo apt-get install -y sshpass
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          sshpass -p "${{ secrets.VPS_PASSWORD_CI }}" ssh $SSH_OPTS \
            ${{ secrets.VPS_USER_CI }}@${{ secrets.VPS_HOST_CI }} \
            "echo '=== DOCKER PS ===' && docker ps -a && echo '=== BACKEND LOGS ===' && docker logs fluxbus-backend-ci --tail 500 && echo '=== NGINX LOGS ===' && docker logs fluxbus-nginx-ci --tail 50" || true

  # ============================================================
  # JOB 4: DEPLOY DEV (so roda se CI passou)
  # ============================================================
  deploy-dev:
    name: "🔧 Deploy DEV"
    needs: health-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: ${{ env.DEV_URL }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "🔐 Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🔍 Verificar Login"
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME esta vazio! Verifique os secrets do ambiente 'dev'."
            exit 1
          fi
          echo "✅ DOCKER_USERNAME configurado."

      - name: "🐳 Re-tag CI -> DEV e push"
        run: |
          # Usar buildx imagetools para re-taggear sem precisar dar pull nas camadas (mais rapido e evita erros de daemon local)
          docker buildx imagetools create z7design/fluxbus-backend:ci    --tag z7design/fluxbus-backend:dev
          docker buildx imagetools create z7design/fluxbus-frontend:ci   --tag z7design/fluxbus-frontend:dev
          docker buildx imagetools create z7design/fluxbus-whatsapp:ci   --tag z7design/fluxbus-whatsapp:dev
          docker buildx imagetools create z7design/fluxbus-astracalls:ci --tag z7design/fluxbus-astracalls:dev

      - name: "🔑 Instalar sshpass"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: "⚙️ Criar .env DEV e subir containers"
        run: |
          JWT="${{ secrets.JWT_SECRET_DEV }}"
          [ -z "$JWT" ] && JWT="jwt_secret_dev_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algo"
          {
            printf 'POSTGRES_DB_DEV=fluxbus_db_dev\n'
            printf 'POSTGRES_USER_DEV=fluxbus_user_dev\n'
            printf 'POSTGRES_PASSWORD_DEV=%s\n' "${{ secrets.POSTGRES_PASSWORD_DEV || 'devpass123' }}"
            printf 'REDIS_PASSWORD_DEV=%s\n'    "${{ secrets.REDIS_PASSWORD_DEV || 'devredispass' }}"
            printf 'JWT_SECRET_DEV=%s\n'        "$JWT"
            printf 'MAIL_HOST=mail.z7design.com.br\n'
            printf 'MAIL_PORT=465\n'
            printf 'MAIL_USERNAME=securedguard@z7design.com.br\n'
            printf 'MAIL_PASSWORD=%s\n'        "${{ secrets.MAIL_PASSWORD }}"
            printf 'MAIL_SSL_ENABLE=true\n'
            printf 'ASTRACALLS_API_ENABLED=true\n'
            printf 'ASTRACALLS_API_URL=http://astracalls-dev:8080\n'
            printf 'ASTRACALLS_API_KEY=%s\n'    "${{ secrets.ASTRACALLS_API_KEY || 'fluxbus_dev_key' }}"
          } > /tmp/dev.env

          HOST="${{ secrets.VPS_HOST_DEV || secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER_DEV || secrets.VPS_USER }}"
          PASS="${{ secrets.VPS_PASSWORD_DEV || secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"

          run_ssh_dev() {
            local max_attempts=3
            local attempt=1
            until sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" "$@"; do
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Falha definitiva após $attempt tentativas de SSH no DEV."
                return 1
              fi
              echo "⚠️ Tentativa $attempt de SSH falhou no DEV. Aguardando 15s para nova tentativa..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          run_scp_dev() {
            local max_attempts=3
            local attempt=1
            until sshpass -p "$PASS" scp $SSH_OPTS "$@"; do
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Falha definitiva após $attempt tentativas de SCP no DEV."
                return 1
              fi
              echo "⚠️ Tentativa $attempt de SCP falhou no DEV. Aguardando 15s para nova tentativa..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          run_ssh_dev "mkdir -p /var/www/fluxbus/dev /var/www/fluxbus/traefik/dynamic"
          run_scp_dev docker-compose.fluxbus.dev.yml "$USER@$HOST:/var/www/fluxbus/dev/docker-compose.yml"
          run_scp_dev traefik-dynamic-dev.yml "$USER@$HOST:/var/www/fluxbus/traefik/dynamic/dev.yml"
          run_scp_dev /tmp/dev.env "$USER@$HOST:/var/www/fluxbus/dev/.env"
          rm -f /tmp/dev.env

          for attempt in 1 2 3; do
            echo "🚀 Conectando ao VPS DEV para subir containers (Tentativa $attempt)..."
            if sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST "DOCKER_USER='${{ secrets.DOCKER_USERNAME }}' DOCKER_PASS='${{ secrets.DOCKER_PASSWORD }}' bash -s" < .github/scripts/deploy-dev.sh; then
              echo "✅ Containers DEV iniciados com sucesso!"
              break
            else
              if [ $attempt -ge 3 ]; then
                echo "❌ Falha definitiva ao subir containers DEV após 3 tentativas."
                exit 1
              fi
              echo "⚠️ Tentativa $attempt de subir containers DEV falhou. Aguardando 15s antes de retentar..."
              sleep 15
            fi
          done

  # ============================================================
  # JOB 5: HEALTH CHECK DEV
  # ============================================================
  health-dev:
    name: "🏥 Health Check DEV"
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "⏳ Aguardar inicializacao (2 min)"
        run: sleep 120

      - name: "🔍 Verificar saude DEV"
        run: |
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.DEV_URL }}/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "DEV saudavel!"; exit 0; }
            sleep 15
          done
          echo "Health check DEV falhou"
          exit 1

      - name: "📋 Exibir logs do backend DEV em caso de falha"
        if: failure()
        run: |
          HOST="${{ secrets.VPS_HOST_DEV || secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER_DEV || secrets.VPS_USER }}"
          PASS="${{ secrets.VPS_PASSWORD_DEV || secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST "docker logs fluxbus-backend-dev --tail 150" || true

  # ============================================================
  # JOB 6: DEPLOY PROD (so roda se DEV passou)
  # ============================================================
  deploy-prod:
    name: "🌟 Deploy PROD"
    needs: health-dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: prod
      url: ${{ env.PROD_URL }}
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          ref: ci

      - name: "🔐 Login Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "🔍 Verificar Login"
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME esta vazio! Verifique os secrets do ambiente 'prod'."
            exit 1
          fi
          echo "✅ DOCKER_USERNAME configurado."

      - name: "🐳 Re-tag CI -> PROD e push"
        run: |
          docker buildx imagetools create z7design/fluxbus-backend:ci    --tag z7design/fluxbus-backend:prod
          docker buildx imagetools create z7design/fluxbus-frontend:ci   --tag z7design/fluxbus-frontend:prod
          docker buildx imagetools create z7design/fluxbus-whatsapp:ci   --tag z7design/fluxbus-whatsapp:prod
          docker buildx imagetools create z7design/fluxbus-astracalls:ci --tag z7design/fluxbus-astracalls:prod

      - name: "🔑 Instalar sshpass"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: "⚙️ Criar .env PROD e subir containers"
        run: |
          JWT="${{ secrets.JWT_SECRET_PROD }}"
          [ -z "$JWT" ] && JWT="jwt_secret_prod_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algo"
          {
            printf 'POSTGRES_DB_PROD=fluxbus_db_prod\n'
            printf 'POSTGRES_USER_PROD=fluxbus_user_prod\n'
            printf 'POSTGRES_PASSWORD_PROD=%s\n' "${{ secrets.POSTGRES_PASSWORD_PROD || 'prodpass123' }}"
            printf 'REDIS_PASSWORD_PROD=%s\n'    "${{ secrets.REDIS_PASSWORD_PROD || 'prodredispass' }}"
            printf 'JWT_SECRET_PROD=%s\n'        "$JWT"
            printf 'MAIL_HOST=mail.z7design.com.br\n'
            printf 'MAIL_PORT=465\n'
            printf 'MAIL_USERNAME=securedguard@z7design.com.br\n'
            printf 'MAIL_PASSWORD=%s\n'        "${{ secrets.MAIL_PASSWORD }}"
            printf 'MAIL_SSL_ENABLE=true\n'
            printf 'EVOLUTION_API_KEY_PROD=%s\n' "${{ secrets.EVOLUTION_API_KEY_PROD  }}"
            printf 'EVOLUTION_API_INSTANCE_PROD=fluxbus_prod\n'
            printf 'ASTRACALLS_API_ENABLED=true\n'
            printf 'ASTRACALLS_API_URL=http://astracalls-prod:8080\n'
            printf 'ASTRACALLS_API_KEY_PROD=%s\n' "${{ secrets.ASTRACALLS_API_KEY_PROD || 'fluxbus_prod_key' }}"
          } > /tmp/prod.env

          HOST="${{ secrets.VPS_HOST_PROD || secrets.VPS_HOST }}"
          USER="${{ secrets.VPS_USER_PROD || secrets.VPS_USER }}"
          PASS="${{ secrets.VPS_PASSWORD_PROD || secrets.VPS_PASSWORD }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=30 -o ConnectTimeout=60 -o TCPKeepAlive=yes"

          run_ssh_prod() {
            local max_attempts=3
            local attempt=1
            until sshpass -p "$PASS" ssh $SSH_OPTS "$USER@$HOST" "$@"; do
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Falha definitiva após $attempt tentativas de SSH no PROD."
                return 1
              fi
              echo "⚠️ Tentativa $attempt de SSH falhou no PROD. Aguardando 15s para nova tentativa..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          run_scp_prod() {
            local max_attempts=3
            local attempt=1
            until sshpass -p "$PASS" scp $SSH_OPTS "$@"; do
              if [ $attempt -ge $max_attempts ]; then
                echo "❌ Falha definitiva após $attempt tentativas de SCP no PROD."
                return 1
              fi
              echo "⚠️ Tentativa $attempt de SCP falhou no PROD. Aguardando 15s para nova tentativa..."
              sleep 15
              attempt=$((attempt + 1))
            done
          }

          run_ssh_prod "mkdir -p /var/www/fluxbus/prod /var/www/fluxbus/traefik/dynamic"
          run_scp_prod docker-compose.fluxbus.prod.yml "$USER@$HOST:/var/www/fluxbus/prod/docker-compose.yml"
          run_scp_prod traefik-dynamic-prod.yml "$USER@$HOST:/var/www/fluxbus/traefik/dynamic/prod.yml"
          run_scp_prod /tmp/prod.env "$USER@$HOST:/var/www/fluxbus/prod/.env"
          rm -f /tmp/prod.env

          for attempt in 1 2 3; do
            echo "🚀 Conectando ao VPS PROD para subir containers (Tentativa $attempt)..."
            if sshpass -p "$PASS" ssh $SSH_OPTS $USER@$HOST "DOCKER_USER='${{ secrets.DOCKER_USERNAME }}' DOCKER_PASS='${{ secrets.DOCKER_PASSWORD }}' bash -s" < .github/scripts/deploy-prod.sh; then
              echo "✅ Containers PROD iniciados com sucesso!"
              break
            else
              if [ $attempt -ge 3 ]; then
                echo "❌ Falha definitiva ao subir containers PROD após 3 tentativas."
                exit 1
              fi
              echo "⚠️ Tentativa $attempt de subir containers PROD falhou. Aguardando 15s antes de retentar..."
              sleep 15
            fi
          done

  # ============================================================
  # JOB 7: HEALTH CHECK PROD + RELATORIO FINAL
  # ============================================================
  health-prod:
    name: "🏥 Health Check PROD"
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "⏳ Aguardar inicializacao (2 min)"
        run: sleep 120

      - name: "🔍 Verificar saude PROD"
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.PROD_URL }}/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "PROD saudavel!"; exit 0; }
            sleep 15
          done
          echo "Health check PROD falhou"
          exit 1

      - name: "🎉 Pipeline concluido com sucesso"
        if: success()
        run: |
          echo "=================================================="
          echo "PIPELINE CI->DEV->PROD CONCLUIDO!"
          echo "SHA: ${{ github.sha }}"
          echo "Hora: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "CI   -> ${{ env.CI_URL }}"
          echo "DEV  -> ${{ env.DEV_URL }}"
          echo "PROD -> ${{ env.PROD_URL }}"
          echo "=================================================="
