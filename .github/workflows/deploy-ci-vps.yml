name: 🚀 Deploy Automático para CI (ci.fluxbus.com.br)

on:
  push:
    branches:
      - ci
  workflow_dispatch:

concurrency:
  group: deploy-ci
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    name: 🔨 Build das Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📱 Build e Push do WhatsApp Service
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: true
          tags: z7design/fluxbus-whatsapp:ci

      - name: 🔧 Build Backend (Gradle)
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: ☕ Build e Push do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-backend:ci

      - name: 🎨 Build Frontend
        run: |
          cd frontend
          rm -rf node_modules
          rm -f package-lock.json
          npm install --legacy-peer-deps --force --no-audit --no-fund
          npm install --no-save --legacy-peer-deps @rollup/rollup-linux-x64-gnu
          npm run build
        env:
          VITE_API_URL: https://ci.fluxbus.com.br/api
          VITE_WS_URL: wss://ci.fluxbus.com.br/ws
          VITE_ENVIRONMENT: ci

      - name: 🖥️ Build e Push do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=https://ci.fluxbus.com.br/api
            VITE_WS_URL=wss://ci.fluxbus.com.br/ws
            VITE_ENVIRONMENT=ci
          tags: z7design/fluxbus-frontend:ci

  deploy:
    name: 🚀 Deploy na VPS CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔑 Instalar sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 📋 Copiar docker-compose.fluxbus.ci.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_CI }}
          username: ${{ secrets.VPS_USER_CI }}
          password: ${{ secrets.VPS_PASSWORD_CI }}
          port: 22
          source: "docker-compose.fluxbus.ci.yml"
          target: "/var/www/fluxbus/ci/"
          strip_components: 0

      - name: 🔧 Renomear arquivo e criar .env na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_CI }}
          username: ${{ secrets.VPS_USER_CI }}
          password: ${{ secrets.VPS_PASSWORD_CI }}
          port: 22
          script: |
            # Criar diretório se não existir
            mkdir -p /var/www/fluxbus/ci
            cd /var/www/fluxbus/ci

            # Renomear arquivo para docker-compose.yml
            mv -f docker-compose.fluxbus.ci.yml docker-compose.yml

            # Criar arquivo .env com as variáveis USANDO AS SECRETS
            cat > .env << 'EOF'
            # ========================================
            # VARIÁVEIS DE AMBIENTE PARA CI.FLUXBUS.COM.BR
            # ========================================
            POSTGRES_DB_CI=fluxbus_db_ci
            POSTGRES_USER_CI=fluxbus_user_ci
            POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI }}
            REDIS_PASSWORD_CI=${{ secrets.REDIS_PASSWORD_CI }}
            JWT_SECRET_CI=${{ secrets.JWT_SECRET_CI }}
            MAIL_HOST=186.209.113.105
            MAIL_PORT=465
            MAIL_USERNAME=securedguard@z7design.com.br
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            EOF

            echo ".env e docker-compose.yml criados com sucesso!"
            ls -la

      - name: 🚀 Pull das novas imagens e restart dos containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_CI }}
          username: ${{ secrets.VPS_USER_CI }}
          password: ${{ secrets.VPS_PASSWORD_CI }}
          port: 22
          script: |
            cd /var/www/fluxbus/ci

            echo "🔐 Logando no Docker Hub..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "📥 Pull das últimas imagens..."
            docker-compose pull

            echo "🔄 Parando containers antigos..."
            docker-compose down

            echo "🚀 Subindo novos containers..."
            docker-compose up -d

            echo "✅ Deploy concluído!"
            echo "📊 Status dos containers:"
            docker-compose ps

  health-check:
    name: 🏥 Health Check do CI
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Aguardar inicialização (2 minutos)
        run: sleep 120

      - name: 🔍 Verificar Health do Backend
        id: health-check
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://ci.fluxbus.com.br/api/health'
          method: 'GET'
          timeout: 30000
        continue-on-error: true

      - name: ✅ Resultado Final
        if: always()
        run: |
          echo "Health check outcome: ${{ steps.health-check.outcome }}"
          echo "🌐 Acesse: https://ci.fluxbus.com.br"
