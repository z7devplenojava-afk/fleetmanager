name: "[LEGADO] Deploy Automático para CI (ci.fluxbus.com.br)"

# DESABILITADO: Substituído por pipeline-ci-dev-prod.yml
# O pipeline sequencial agora controla CI -> DEV -> PROD.
on:
  workflow_dispatch:

concurrency:
  group: deploy-ci
  # Mantém o deploy em andamento; novo push enfileira em vez de cancelar
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '17'
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    name: 🔨 Build das Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'


      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📱 Build e Push do WhatsApp Service
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: true
          tags: z7design/fluxbus-whatsapp:ci

      - name: 🔧 Build Backend (Gradle)
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: ☕ Build e Push do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-backend:ci

      - name: 🖥️ Build e Push do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=https://ci.fluxbus.com.br/api
            VITE_WS_URL=wss://ci.fluxbus.com.br/ws
            VITE_ENVIRONMENT=ci
          tags: z7design/fluxbus-frontend:ci

  deploy:
    name: 🚀 Deploy na VPS CI
    needs: build
    runs-on: ubuntu-latest
    env:
      # Prefere secrets genéricas; fallback para *_CI
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.VPS_HOST_CI }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USER_CI }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASSWORD_CI }}
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔎 Validar secrets SSH
        run: |
          missing=0
          [ -n "$VPS_HOST" ] || { echo "::error::Falta VPS_HOST (ou VPS_HOST_CI)"; missing=1; }
          [ -n "$VPS_USER" ] || { echo "::error::Falta VPS_USER (ou VPS_USER_CI)"; missing=1; }
          [ -n "$VPS_PASSWORD" ] || { echo "::error::Falta VPS_PASSWORD (ou VPS_PASSWORD_CI)"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Configure em GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Secrets SSH presentes (host/user/password)."

      - name: 🔑 Instalar sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 🔎 Garantir docker-compose.ci.yml no checkout
        run: |
          if [ ! -f docker-compose.ci.yml ]; then
            echo "::error::Arquivo docker-compose.ci.yml ausente neste branch"
            ls -la docker-compose*.yml || true
            exit 1
          fi
          if [ ! -f nginx/ci.conf ]; then
            echo "::error::Arquivo nginx/ci.conf ausente neste branch"
            exit 1
          fi
          ls -la docker-compose.ci.yml nginx/ci.conf

      - name: 📋 Copiar docker-compose.ci.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          source: "docker-compose.ci.yml"
          target: "/var/www/fluxbus/ci/"
          strip_components: 0
          overwrite: true

      - name: 📋 Copiar nginx/ci.conf para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          source: "nginx/ci.conf"
          target: "/var/www/fluxbus/ci/nginx/"
          strip_components: 1
          overwrite: true

      - name: 🔧 Ajustar paths e criar .env na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          script: |
            mkdir -p /var/www/fluxbus/ci/nginx /var/www/fluxbus/ci/uploads /var/www/fluxbus/uploads
            cd /var/www/fluxbus/ci

            cat > .env << 'EOF'
            # ========================================
            # VARIÁVEIS DE AMBIENTE PARA CI.FLUXBUS.COM.BR
            # ========================================
            POSTGRES_DB_CI=fluxbus_db_ci
            POSTGRES_USER_CI=fluxbus_user_ci
            POSTGRES_PASSWORD_CI=${{ secrets.POSTGRES_PASSWORD_CI || '4KaCiJc6an@7sgbdcid2026' }}
            REDIS_PASSWORD_CI=${{ secrets.REDIS_PASSWORD_CI || 'redis_ci_2026' }}
            JWT_SECRET_CI=${{ secrets.JWT_SECRET_CI || 'jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algo' }}
            MAIL_HOST=${{ secrets.MAIL_HOST || 'mail.z7design.com.br' }}
            MAIL_PORT=${{ secrets.MAIL_PORT || '465' }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME || 'securedguard@z7design.com.br' }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_SSL_ENABLE=true
            BAILEYS_REST_URL=${{ secrets.BAILEYS_REST_URL || 'http://whatsapp-service-ci:3333' }}
            BAILEYS_ENABLED=${{ secrets.BAILEYS_ENABLED || 'true' }}
            BAILEYS_INSTANCE_KEY=fluxbus_ci
            EOF

            echo ".env criado com sucesso!"
            ls -la

      - name: 🚀 Pull das novas imagens e restart dos containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🔐 Logando no Docker Hub..."
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Remover containers orfaos de nomes fixos (conflito de container_name)
            docker rm -f fluxbus-nginx-ci fluxbus-db-ci fluxbus-redis-ci fluxbus-backend-ci fluxbus-frontend-ci fluxbus-whatsapp-ci whatsapp-service-ci 2>/dev/null || true

            # Derrubar stack legado antigo (compose renomeado em /var/www/fluxbus)
            if [ -f /var/www/fluxbus/docker-compose.yml ]; then
              (cd /var/www/fluxbus && docker compose down --remove-orphans) 2>/dev/null || true
            fi

            cd /var/www/fluxbus/ci
            docker network create z7network 2>/dev/null || true
            docker compose -f docker-compose.ci.yml down --remove-orphans 2>/dev/null || true
            docker network rm fluxbus-ci 2>/dev/null || true

            echo "📥 Pull das últimas imagens..."
            docker compose -f docker-compose.ci.yml pull

            echo "🚀 Subindo containers..."
            docker compose -f docker-compose.ci.yml up -d --force-recreate --remove-orphans

            echo "✅ Deploy concluído!"
            echo "📊 Status dos containers:"
            docker compose -f docker-compose.ci.yml ps

  health-check:
    name: 🏥 Health Check do CI
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Aguardar inicialização (90s)
        run: sleep 90

      - name: 🔍 Verificar Health do Backend (retry real)
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://ci.fluxbus.com.br/api/health" --max-time 15 2>/dev/null || echo "000")
            echo "Tentativa $i - HTTP $CODE"
            [ "$CODE" = "200" ] && { echo "CI saudável!"; exit 0; }
            sleep 15
          done
          echo "::error::Health check do CI falhou após 30 tentativas"
          exit 1

      - name: 🌐 Acesso
        if: always()
        run: 'echo "🌐 Acesse: https://ci.fluxbus.com.br"'
