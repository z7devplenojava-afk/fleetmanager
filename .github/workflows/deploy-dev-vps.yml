name: "[LEGADO] Deploy DEV VPS (use pipeline-ci-dev-prod.yml)"

# DESABILITADO: Substituido por pipeline-ci-dev-prod.yml
# O pipeline sequencial controla CI -> DEV -> PROD automaticamente.
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '17'
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    name: 🔨 Build das Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: 🔐 Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📱 Build e Push do WhatsApp Service
        uses: docker/build-push-action@v5
        with:
          context: ./whatsapp-service
          file: ./whatsapp-service/Dockerfile
          push: true
          tags: z7design/fluxbus-whatsapp:dev

      - name: 🔧 Build Backend (Gradle)
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: ☕ Build e Push do Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: z7design/fluxbus-backend:dev

      - name: 🖥️ Build e Push do Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          build-args: |
            VITE_API_URL=https://dev.fluxbus.com.br/api
            VITE_WS_URL=wss://dev.fluxbus.com.br/ws
            VITE_ENVIRONMENT=dev
          tags: z7design/fluxbus-frontend:dev

  deploy:
    name: 🚀 Deploy na VPS Dev
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.VPS_HOST_DEV }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USER_DEV }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || secrets.VPS_PASSWORD_DEV }}
    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🔎 Validar secrets SSH
        run: |
          missing=0
          [ -n "$VPS_HOST" ] || { echo "::error::Falta VPS_HOST (ou VPS_HOST_DEV)"; missing=1; }
          [ -n "$VPS_USER" ] || { echo "::error::Falta VPS_USER (ou VPS_USER_DEV)"; missing=1; }
          [ -n "$VPS_PASSWORD" ] || { echo "::error::Falta VPS_PASSWORD (ou VPS_PASSWORD_DEV)"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Configure em GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Secrets SSH presentes (host/user/password)."

      - name: 🔑 Instalar sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 🔎 Garantir docker-compose.fluxbus.dev.yml no checkout
        run: |
          if [ ! -f docker-compose.fluxbus.dev.yml ]; then
            echo "::error::Arquivo docker-compose.fluxbus.dev.yml ausente neste branch"
            ls -la docker-compose*.yml || true
            exit 1
          fi
          ls -la docker-compose.fluxbus.dev.yml

      - name: 📋 Copiar docker-compose.fluxbus.dev.yml para a VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          source: "docker-compose.fluxbus.dev.yml"
          target: "/var/www/fluxbus/dev/"
          strip_components: 0
          overwrite: true

      - name: 🔧 Renomear arquivo e criar .env na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          script: |
            # Criar diretório principal e subpastas se não existirem
            mkdir -p /var/www/fluxbus/ci
            mkdir -p /var/www/fluxbus/dev
            mkdir -p /var/www/fluxbus/prod
            cd /var/www/fluxbus/dev

            # Renomear arquivo para docker-compose.yml
            mv -f docker-compose.fluxbus.dev.yml docker-compose.yml

            # Criar arquivo .env com as variáveis USANDO AS SECRETS
            cat > .env << 'EOF'
            # ========================================
            # VARIÁVEIS DE AMBIENTE PARA DEV.FLUXBUS.COM.BR
            # ========================================
            POSTGRES_DB_DEV=fluxbus_db_dev
            POSTGRES_USER_DEV=fluxbus_user_dev
            POSTGRES_PASSWORD_DEV=${{ secrets.POSTGRES_PASSWORD_DEV }}
            REDIS_PASSWORD_DEV=${{ secrets.REDIS_PASSWORD_DEV }}
            JWT_SECRET_DEV=${{ secrets.JWT_SECRET_DEV }}
            MAIL_HOST=186.209.113.105
            MAIL_PORT=465
            MAIL_USERNAME=securedguard@z7design.com.br
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            EOF

            echo ".env e docker-compose.yml criados com sucesso em /var/www/fluxbus/dev!"
            ls -la /var/www/fluxbus/
            ls -la /var/www/fluxbus/dev/

      - name: 🚀 Pull das novas imagens e restart dos containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: 22
          script: |
            cd /var/www/fluxbus/dev

            echo "🔐 Logando no Docker Hub..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "📥 Pull das últimas imagens..."
            docker compose pull

            echo "🔄 Parando containers antigos..."
            docker compose down

            echo "🚀 Subindo novos containers..."
            docker compose up -d

            echo "✅ Deploy concluído!"
            echo "📊 Status dos containers:"
            docker compose ps

  health-check:
    name: 🏥 Health Check do Dev
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Aguardar inicialização (2 minutos)
        run: sleep 120

      - name: 🔍 Verificar Health do Backend
        id: health-check
        uses: fjogeleit/http-request-action@v1
        with:
          url: 'https://dev.fluxbus.com.br/api/health'
          method: 'GET'
          timeout: 30000
        continue-on-error: true

      - name: ✅ Resultado Final
        if: always()
        run: |
          echo "Health check outcome: ${{ steps.health-check.outcome }}"
          echo "🌐 Acesse: https://dev.fluxbus.com.br"
