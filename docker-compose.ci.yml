version: '3.8'

# ========================================
# DOCKER COMPOSE - AMBIENTE CI
# URL: https://ci.fluxbus.com.br
# Pasta VPS: /var/www/fluxbus/ci
# ========================================

services:
  # ========================================
  # DATABASE CI
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: fluxbus-db-ci
    env_file:
      - .env
    environment:
      POSTGRES_DB: fluxbus_ci
      POSTGRES_USER: fluxbus_ci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-FluxBus@2026}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxbus_ci"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE CI
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: fluxbus-redis-ci
    env_file:
      - .env
    ports:
      - "6381:6379"
    volumes:
      - redis_data_ci:/data
    networks:
      - fluxbus-ci-network
      - z7network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD_CI:-redis_ci_2025}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD_CI:-redis_ci_2025}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API CI
  # ========================================
  backend-ci:
    image: z7design/fluxbus-backend:ci
    container_name: fluxbus-backend-ci
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/fluxbus_ci
      SPRING_DATASOURCE_USERNAME: fluxbus_ci
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-FluxBus@2026}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD_CI:-redis_ci_2025}
      JWT_SECRET: ${JWT_SECRET_CI:-jwt_secret_ci_2025_secure_key_64bytes_minimum_required_for_hmac_sha512_algorithm_secure}
      JWT_EXPIRATION: 604800000
      JWT_REFRESH_EXPIRATION: 2592000000
      UPLOAD_DIR: /var/www/fluxbus/ci/uploads
      LOGGING_FILE_PATH: /var/www/fluxbus/ci/logs/application.log
      MAIL_HOST: 186.209.113.105
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-securedguard@z7design.com.br}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS_ENABLE: "false"
      MAIL_SSL_ENABLE: "true"
      MAIL_SOCKET_FACTORY: javax.net.ssl.SSLSocketFactory
      MAIL_SOCKET_FACTORY_PORT: "465"
      MAIL_CONNECTION_TIMEOUT: "10000"
      MAIL_TIMEOUT: "10000"
      MAIL_WRITE_TIMEOUT: "10000"
      MAIL_DEBUG: "false"
      BAILEYS_REST_URL: ${BAILEYS_REST_URL:-http://whatsapp-service-ci:3333}
      BAILEYS_ENABLED: ${BAILEYS_ENABLED:-true}
      BAILEYS_INSTANCE_KEY: ${BAILEYS_INSTANCE_KEY:-fluxbus_ci}
    ports:
      - "8081:8080"
    volumes:
      - uploads_ci:/var/www/fluxbus/ci/uploads
      - logs_ci:/var/www/fluxbus/ci/logs
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  # ========================================
  # WHATSAPP SERVICE CI
  # ========================================
  whatsapp-service-ci:
    image: z7design/fluxbus-whatsapp:ci
    container_name: fluxbus-whatsapp-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: fluxbus_ci
      SESSION_DIR: /app/sessions
      WEBHOOK_URL: http://backend-ci:8080/api/whatsapp/webhook
      NODE_ENV: production
    ports:
      - "3335:3333"
    volumes:
      - whatsapp_sessions_ci:/app/sessions
      - uploads_ci:/app/uploads
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    shm_size: 256mb
    labels:
      - "traefik.enable=false"

  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    image: z7design/fluxbus-frontend:ci
    container_name: fluxbus-frontend-ci
    ports:
      - "3002:80"
    depends_on:
      backend-ci:
        condition: service_started
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fluxbus-ci-https.rule=Host(`ci.fluxbus.com.br`)"
      - "traefik.http.routers.fluxbus-ci-https.entrypoints=websecure"
      - "traefik.http.routers.fluxbus-ci-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.fluxbus-ci-https.service=fluxbus-ci-service"
      - "traefik.http.routers.fluxbus-ci-https.priority=2000"
      - "traefik.http.routers.fluxbus-ci-http.rule=Host(`ci.fluxbus.com.br`)"
      - "traefik.http.routers.fluxbus-ci-http.entrypoints=web"
      - "traefik.http.routers.fluxbus-ci-http.middlewares=redirect-https@docker"
      - "traefik.http.routers.fluxbus-ci-http.priority=2000"
      - "traefik.http.services.fluxbus-ci-service.loadbalancer.server.port=80"
      # CORS
      - "traefik.http.middlewares.fluxbus-ci-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD"
      - "traefik.http.middlewares.fluxbus-ci-cors.headers.accesscontrolalloworiginlist=https://ci.fluxbus.com.br,https://dev.fluxbus.com.br,https://fluxbus.com.br"
      - "traefik.http.middlewares.fluxbus-ci-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.fluxbus-ci-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.fluxbus-ci-https.middlewares=fluxbus-ci-cors@docker"
      - "traefik.docker.network=z7network"

  # ========================================
  # NGINX PROXY CI (roteia /api → backend, / → frontend)
  # ========================================
  nginx-ci:
    image: nginx:alpine
    container_name: fluxbus-nginx-ci
    ports:
      - "8082:80"
    volumes:
      - ./nginx/ci.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-ci
      - frontend-ci
    networks:
      - fluxbus-ci-network
      - z7network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

# ========================================
# VOLUMES CI
# ========================================
volumes:
  postgres_data_ci:
    driver: local
  redis_data_ci:
    driver: local
  uploads_ci:
    driver: local
  logs_ci:
    driver: local
  whatsapp_sessions_ci:
    driver: local

# ========================================
# NETWORKS CI
# ========================================
networks:
  fluxbus-ci-network:
    driver: bridge
    name: fluxbus-ci
  z7network:
    external: true
    name: z7network