version: '3.8'

# ========================================
# DOCKER COMPOSE APENAS PARA AMBIENTE CI
# ========================================

services:
  # ========================================
  # DATABASE CI
  # ========================================
  postgres-ci:
    image: postgres:15-alpine
    container_name: fluxbus-db-ci
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_CI:-fluxbus_db_ci}
      POSTGRES_USER: ${POSTGRES_USER_CI:-fluxbus_user_ci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_ci:/var/lib/postgresql/data
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_CI:-fluxbus_user_ci} -d ${POSTGRES_DB_CI:-fluxbus_db_ci}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # REDIS CACHE CI
  # ========================================
  redis-ci:
    image: redis:7-alpine
    container_name: fluxbus-redis-ci
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data_ci:/data
    networks:
      - fluxbus-ci-network
      - z7network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD_CI:-redis_ci_2026}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD_CI:-redis_ci_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================
  # BACKEND API CI
  # ========================================
  backend-ci:
    image: z7design/fluxbus-backend:ci
    container_name: fluxbus-backend-ci
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ci:5432/${POSTGRES_DB_CI:-fluxbus_db_ci}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_CI:-fluxbus_user_ci}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_CI:-4KaCiJc6an@7sgbdcid2026}
      SPRING_REDIS_HOST: redis-ci
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD_CI:-redis_ci_2026}
      JWT_SECRET: ${JWT_SECRET_CI:-jwt_secret2026}
      JWT_EXPIRATION: 604800000
      JWT_REFRESH_EXPIRATION: 2592000000
      UPLOAD_DIR: /var/www/fluxbus/uploads
      LOGGING_FILE_PATH: /var/www/fluxbus/logs/application.log
      # Email Configuration
      MAIL_HOST: 186.209.113.105
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-securedguard@z7design.com.br}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-D8rKeqSFZfaS$(y7}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-false}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-true}
      MAIL_SOCKET_FACTORY: ${MAIL_SOCKET_FACTORY:-javax.net.ssl.SSLSocketFactory}
      MAIL_SOCKET_FACTORY_PORT: ${MAIL_SOCKET_FACTORY_PORT:-465}
      MAIL_CONNECTION_TIMEOUT: ${MAIL_CONNECTION_TIMEOUT:-10000}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10000}
      MAIL_WRITE_TIMEOUT: ${MAIL_WRITE_TIMEOUT:-10000}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      # WhatsApp Configuration
      BAILEYS_REST_URL: ${BAILEYS_REST_URL:-http://whatsapp-service-ci:3333}
      BAILEYS_ENABLED: ${BAILEYS_ENABLED:-true}
      BAILEYS_INSTANCE_KEY: ${BAILEYS_INSTANCE_KEY:-fluxbus_ci}
    ports:
      - "8081:8080"
    volumes:
      - uploads_ci:/var/www/fluxbus/uploads
      - logs_ci:/var/www/fluxbus/logs
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
      whatsapp-service-ci:
        condition: service_started
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

  # ========================================
  # WHATSAPP SERVICE (Baileys)
  # ========================================
  whatsapp-service-ci:
    image: z7design/fluxbus-whatsapp:ci
    container_name: fluxbus-whatsapp-ci
    environment:
      PORT: 3333
      INSTANCE_KEY: fluxbus_ci
      SESSION_DIR: /app/sessions
      WEBHOOK_URL: http://backend-ci:8080/api/whatsapp/webhook
      NODE_ENV: production
    ports:
      - "3333:3333"
    volumes:
      - whatsapp_sessions_ci:/app/sessions
      - uploads_ci:/app/uploads
    depends_on:
      postgres-ci:
        condition: service_healthy
      redis-ci:
        condition: service_healthy
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/health || curl -f http://localhost:3333/instance/connectionState?key=fluxbus_ci || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # Memória compartilhada para Chromium/Puppeteer
    shm_size: 256mb
    labels:
      - "traefik.enable=false"

  # ========================================
  # EVOLUTION API CI (DESABILITADO - imagem indisponivel)
  # ========================================
  # evolution-api-ci e redis-evolution-ci removidos para CI
  # O CI usa Baileys (whatsapp-service-ci) para WhatsApp

  # ========================================
  # NGINX PROXY CI
  # ========================================
  nginx-ci:
    image: nginx:alpine
    container_name: fluxbus-nginx-ci
    ports:
      - "8082:80"
    volumes:
      - ./nginx/ci.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend-ci:
        condition: service_started
      frontend-ci:
        condition: service_started
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Router HTTPS - suportando ambos os domínios
      - "traefik.http.routers.nginx-ci-https.rule=Host(`ci.fluxbus.com.br`) || Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci-https.entrypoints=websecure"
      - "traefik.http.routers.nginx-ci-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.nginx-ci-https.service=nginx-ci-service"
      - "traefik.http.routers.nginx-ci-https.priority=2000"
      # Router HTTP - SEM redirect para HTTPS (Cloudflare gerencia SSL; redirect causaria ERR_TOO_MANY_REDIRECTS no modo Flexible)
      - "traefik.http.routers.nginx-ci-http.rule=Host(`ci.fluxbus.com.br`) || Host(`ci.z7botsolutions.com.br`)"
      - "traefik.http.routers.nginx-ci-http.entrypoints=web"
      - "traefik.http.routers.nginx-ci-http.service=nginx-ci-service"
      - "traefik.http.routers.nginx-ci-http.middlewares=nginx-ci-cloudflare-proto@docker"
      - "traefik.http.routers.nginx-ci-http.priority=2000"
      # Serviço
      - "traefik.http.services.nginx-ci-service.loadbalancer.server.port=80"
      # Middleware: propagar X-Forwarded-Proto do Cloudflare para o backend
      - "traefik.http.middlewares.nginx-ci-cloudflare-proto.headers.customrequestheaders.X-Forwarded-Proto=https"
      # Middlewares CORS
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolalloworiginlist=*"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowheaders=*"
      - "traefik.http.middlewares.nginx-ci-cors.headers.accesscontrolallowcredentials=true"
      - "traefik.http.routers.nginx-ci-https.middlewares=nginx-ci-cors@docker,nginx-ci-cloudflare-proto@docker"
      # Forçar detecção na rede correta
      - "traefik.docker.network=z7network"

  # ========================================
  # FRONTEND CI
  # ========================================
  frontend-ci:
    image: z7design/fluxbus-frontend:ci
    container_name: fluxbus-frontend-ci
    ports:
      - "3000:80"
    depends_on:
      backend-ci:
        condition: service_started
    networks:
      - fluxbus-ci-network
      - z7network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # DESABILITADO TRAEFIK - usando Nginx como proxy reverso
    labels:
      - "traefik.enable=false"

# ========================================
# VOLUMES CI
# ========================================
volumes:
  postgres_data_ci:
    driver: local
  redis_data_ci:
    driver: local
  uploads_ci:
    driver: local
  logs_ci:
    driver: local
  whatsapp_sessions_ci:
    driver: local

# ========================================
# NETWORKS CI
# ========================================
networks:
  fluxbus-ci-network:
    driver: bridge
    name: fluxbus-ci
  z7network:
    external: true
    name: z7network