version: '3.8'

# ============================================
# FLUXBUS - AMBIENTE TEST
# Nomenclatura: fluxbus-test-*
# Portas: 5433 (DB), 6380 (Redis), 8084 (Backend), 3001 (Frontend), 3334 (WhatsApp)
# ============================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: fluxbus-test-db
    hostname: fluxbus-test-db
    environment:
      POSTGRES_DB: fluxbus_db_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    ports:
      - "5433:5432"
    volumes:
      - fluxbus-test-db-data:/var/lib/postgresql/data
      - ./seeds/schema:/docker-entrypoint-initdb.d/01-schema:ro
      - ./seeds/common:/docker-entrypoint-initdb.d/02-common:ro
      - ./seeds/test:/docker-entrypoint-initdb.d/03-test:ro
    networks:
      - fluxbus-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d fluxbus_db_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fluxbus-test-redis
    hostname: fluxbus-test-redis
    ports:
      - "6380:6379"
    volumes:
      - fluxbus-test-redis-data:/data
    networks:
      - fluxbus-test-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    image: fluxbus-whatsapp:test
    container_name: fluxbus-test-whatsapp
    hostname: fluxbus-test-whatsapp
    environment:
      PORT: 3333
      INSTANCE_KEY: fluxbus_db_test
      SESSION_DIR: /app/sessions
      NODE_ENV: test
    volumes:
      - fluxbus-test-whatsapp-sessions:/app/sessions
    ports:
      - "3334:3333"
    networks:
      - fluxbus-test-network
    dns:
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fluxbus-backend:test
    container_name: fluxbus-test-backend
    hostname: fluxbus-test-backend
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://fluxbus-test-db:5432/fluxbus_db_test
      SPRING_DATASOURCE_USERNAME: test_user
      SPRING_DATASOURCE_PASSWORD: test_pass
      SPRING_REDIS_HOST: fluxbus-test-redis
      SPRING_REDIS_PORT: 6379
      BAILEYS_ENABLED: "true"
      BAILEYS_REST_URL: http://fluxbus-test-whatsapp:3333
      JWT_SECRET: ${JWT_SECRET_TEST}
    ports:
      - "8084:8083"
    networks:
      - fluxbus-test-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: fluxbus-frontend:test
    container_name: fluxbus-test-frontend
    hostname: fluxbus-test-frontend
    environment:
      VITE_API_URL: https://test.z7botsolutions.com.br
      VITE_ENV: test
    ports:
      - "3001:80"
    networks:
      - fluxbus-test-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  fluxbus-test-db-data:
    name: fluxbus-test-db-data
  fluxbus-test-redis-data:
    name: fluxbus-test-redis-data
  fluxbus-test-whatsapp-sessions:
    name: fluxbus-test-whatsapp-sessions

networks:
  fluxbus-test-network:
    name: fluxbus-test-network
    driver: bridge





























