# ===================== CONFIGURAÇÃO PARA VPS - DESENVOLVIMENTO =====================

# ===================== CONFIGURAÇÃO DE BANCO DE DADOS =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/fleetmanager_dev
spring.datasource.username=postgressg
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== CONFIGURAÇÃO JPA VPS DEV =====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================== CONFIGURAÇÃO FLYWAY =====================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===================== CONFIGURAÇÃO DE LOGGING =====================
logging.level.root=INFO
logging.level.com.z7design.secured_guard=DEBUG

# ===================== CONFIGURAÇÃO DE SERVIDOR =====================
server.port=8081

# ===================== CONFIGURAÇÃO JWT =====================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===================== CONFIGURAÇÃO DE EMAIL PARA DEV =====================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=dev@localhost
spring.mail.password=dev
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===================== CONFIGURAÇÃO DE SINCRONIZAÇÃO =====================
app.database.sync.enabled=false
app.database.sync.interval=300000
