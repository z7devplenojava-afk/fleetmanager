# ===================== CONFIGURAÇÃO DE DESENVOLVIMENTO =====================

# ===================== CONFIGURAÇÃO DE BANCO DE DADOS =====================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fluxbus_dev}
spring.datasource.username=${POSTGRES_USER:fluxbus_user_dev}
spring.datasource.password=${POSTGRES_PASSWORD:dev_password_123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== CONFIGURAÇÃO DE SERVIDOR =====================
server.port=8081
server.address=0.0.0.0
# IMPORTANTE: Respeitar headers X-Forwarded-Proto do Cloudflare/Traefik/Nginx
server.forward-headers-strategy=framework
spring.main.allow-circular-references=true

# Request & Multipart Size Configuration (Evita 413 Payload Too Large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

# ===================== CONFIGURAÇÃO JWT =====================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===================== CONFIGURAÇÃO JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================== CONFIGURAÇÃO FLYWAY (AMBIENTE DEV) =====================
# Flyway desabilitado - usando JPA ddl-auto=update para criar/atualizar tabelas automaticamente
spring.flyway.enabled=false

