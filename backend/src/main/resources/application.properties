# ===================== CONFIGURAÇÃO PRINCIPAL =====================
spring.application.name=fluxbus

# ===================== CONFIGURAÇÃO DE PERFIL =====================
# Define o perfil ativo via variável/prop: SPRING_PROFILES_ACTIVE. Padrão: test
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================== CONFIGURAÇÃO DE REFERÊNCIAS CIRCULARES =====================
# Permite referências circulares temporariamente para resolver dependência entre SecurityConfig e JwtAuthenticationFilter
spring.main.allow-circular-references=true

# ===================== CONFIGURAÇÕES COMUNS =====================

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_source=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_source=none
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.drop_action=none
spring.jpa.properties.hibernate.hbm2ddl.schema_generation.create_action=none

# Server Configuration
server.port=8081
server.address=0.0.0.0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Request & Multipart Size Configuration (Evita 413 Payload Too Large)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB
server.tomcat.max-http-form-post-size=150MB
server.tomcat.max-swallow-size=150MB

# JWT Configuration
# SEGURANÇA: Secret obrigatório via env var, sem fallback hardcoded.
# Gerar com: openssl rand -hex 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# Configurações de servidor
server.tomcat.max-threads=200
server.tomcat.max-connections=10000
server.tomcat.accept-count=100
server.tomcat.max-keep-alive-requests=100
server.tomcat.keep-alive-timeout=20000
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# Configurações de cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Configurações de banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/fleetmanager_test}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234567}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Configurações de JPA
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Configurações de memória
spring.jvm.memory.initial=256m
spring.jvm.memory.max=1024m

# ===================== CONFIGURAÇÕES FLYWAY =====================
# Flyway está habilitado por padrão, mas vamos garantir que está configurado
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# Configurações de segurança
spring.security.filter.order=10
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR

# Configurações de compressão
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Configurações de timeout
spring.mvc.async.request-timeout=300000

# ===================== CONFIGURAÇÕES REDIS =====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
fluxbus.redis.workers.enabled=${REDIS_WORKERS_ENABLED:false}

# ===================== CONFIGURAÇÕES GEMINI API =====================
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.enabled=${GEMINI_API_ENABLED:false}
gemini.api.model=${GEMINI_API_MODEL:gemini-pro-vision}
gemini.api.timeout=30000
gemini.api.max-retries=3

# ===================== BILIFLUX — ASSISTENTE VIRTUAL =====================
biliflux.gemini.text-model=${BILIFLUX_GEMINI_MODEL:gemini-1.5-flash}

# ===================== CONFIGURAÇÕES MINIO/S3 =====================
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.pages=${MINIO_BUCKET_PAGES:document-pages}
minio.bucket.unified=${MINIO_BUCKET_UNIFIED:unified-documents}
minio.enabled=${MINIO_ENABLED:false}

# ===================== CONFIGURAÇÕES DE LOGGING =====================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=backend_debug.log
logging.level.com.z7design.fleet_manager=INFO
logging.level.com.z7design.fleet_manager.worker=WARN
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR

# ===================== CONFIGURAÇÕES DE EMAIL =====================
# Credenciais via env vars — NUNCA commitar senha real em properties/comentários.
spring.mail.host=${MAIL_HOST:186.209.113.105}
spring.mail.port=${MAIL_PORT:465}
# Identidade transacional do sistema (mailcow/domínio fluxbus.com.br).
# Em produção, defina MAIL_USERNAME/MAIL_FROM via variável de ambiente.
spring.mail.username=${MAIL_USERNAME:noreply@fluxbus.com.br}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Configuração padrão: porta 465 com SSL direto
# Para usar porta 587 com STARTTLS, defina: MAIL_PORT=587, MAIL_STARTTLS_ENABLE=true, MAIL_SSL_ENABLE=false
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
# SocketFactory apenas para porta 465 (SSL direto) - não usar com porta 587
# Se MAIL_PORT=465, defina: MAIL_SOCKET_FACTORY=javax.net.ssl.SSLSocketFactory e MAIL_SOCKET_FACTORY_PORT=465
# Se MAIL_PORT=587, deixe vazio (STARTTLS não usa socketFactory)
spring.mail.properties.mail.smtp.socketFactory.class=${MAIL_SOCKET_FACTORY:javax.net.ssl.SSLSocketFactory}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SOCKET_FACTORY_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Timeouts aumentados para evitar problemas de conexão
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:60000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:60000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:60000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# === Provisionamento de caixas corporativas (Mailcow + Cloudflare) ===
app.mailcow.enabled=${MAILCOW_ENABLED:false}
app.mailcow.url=${MAILCOW_URL:}
app.mailcow.api-token=${MAILCOW_API_TOKEN:}
app.mailcow.default-quota-mb=${MAILCOW_DEFAULT_QUOTA_MB:1024}
app.mail.host=${MAIL_SERVER_HOSTNAME:mail.fluxbus.com.br}
app.mail.server-ip=${MAIL_SERVER_IP:}
app.cloudflare.enabled=${CLOUDFLARE_DNS_ENABLED:false}
app.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
app.cloudflare.zone-id=${CLOUDFLARE_ZONE_ID:}
spring.mail.properties.mail.smtp.from=SecuredGuard <securedguard@z7design.com.br>

app.file.upload-dir=uploads/maintenance

# ===================== NFS-e NACIONAL (SEFIN) =====================
# 1 = Produção, 2 = Homologação (produção restrita). Comece sempre em 2.
fiscal.nfse.environment=${FISCAL_NFSE_ENVIRONMENT:2}
fiscal.nfse.sefin-url-homologacao=${FISCAL_NFSE_SEFIN_URL_HOMOLOGACAO:https://sefin.producaorestrita.nfse.gov.br/API/SefinNacional}
fiscal.nfse.sefin-url-producao=${FISCAL_NFSE_SEFIN_URL_PRODUCAO:https://sefin.nfse.gov.br/SefinNacional}
fiscal.nfse.timeout-seconds=${FISCAL_NFSE_TIMEOUT_SECONDS:90}
# Chave AES-256 (Base64) usada para criptografar o certificado A1 em repouso.
# Gere com: openssl rand -base64 32
fiscal.certificate.encryption-key=${FISCAL_CERTIFICATE_ENCRYPTION_KEY:}
# Caminho do recurso de eventos na API SEFIN (cancelamento etc.)
fiscal.nfse.evento-path=${FISCAL_NFSE_EVENTO_PATH:/eventos}

# ===================== CT-e 4.00 (SEFAZ) =====================
# 1 = Producao, 2 = Homologacao. As URLs dependem da UF e do WebService autorizado.
fiscal.cte.environment=${FISCAL_CTE_ENVIRONMENT:2}
fiscal.cte.sefaz-url-homologacao=${FISCAL_CTE_SEFAZ_URL_HOMOLOGACAO:}
fiscal.cte.sefaz-url-producao=${FISCAL_CTE_SEFAZ_URL_PRODUCAO:}
fiscal.cte.timeout-seconds=${FISCAL_CTE_TIMEOUT_SECONDS:90}
fiscal.cte.soap-action=${FISCAL_CTE_SOAP_ACTION:}

# ===================== NF-e 4.00 (SEFAZ) =====================
fiscal.nfe.environment=${FISCAL_NFE_ENVIRONMENT:2}
fiscal.nfe.sefaz-url-homologacao=${FISCAL_NFE_SEFAZ_URL_HOMOLOGACAO:}
fiscal.nfe.sefaz-url-producao=${FISCAL_NFE_SEFAZ_URL_PRODUCAO:}
fiscal.nfe.timeout-seconds=${FISCAL_NFE_TIMEOUT_SECONDS:90}
fiscal.nfe.soap-action=${FISCAL_NFE_SOAP_ACTION:}
# Endpoints separados (vazios = usa a URL unica acima)
fiscal.nfe.consulta-url-homologacao=${FISCAL_NFE_CONSULTA_URL_HOMOLOGACAO:}
fiscal.nfe.consulta-url-producao=${FISCAL_NFE_CONSULTA_URL_PRODUCAO:}
fiscal.nfe.evento-url-homologacao=${FISCAL_NFE_EVENTO_URL_HOMOLOGACAO:}
fiscal.nfe.evento-url-producao=${FISCAL_NFE_EVENTO_URL_PRODUCAO:}

# ===================== WHATSAPP PROVIDER =====================
# Provedor usado pelo painel/API legada de conexao
whatsapp.provider=evolution

# Provedor padrao para notificacoes automaticas (OS concluida).
# Pode ser sobrescrito por empresa em company_whatsapp_configs.
whatsapp.notifications.provider=${WHATSAPP_NOTIFICATIONS_PROVIDER:astracalls}

# ===================== GOOGLE MAPS / PLACES API =====================
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
google.maps.api.enabled=${GOOGLE_MAPS_ENABLED:false}

# ===================== WHATSAPP - EVOLUTION API =====================
# Evolution API (atendai/evolution-api:v2.1.1)
# SEGURANÇA: chave via env var, sem fallback commitado.
evolution.api.enabled=${EVOLUTION_API_ENABLED:true}
evolution.api.url=${EVOLUTION_API_URL:http://localhost:8084}
evolution.api.key=${EVOLUTION_API_KEY:minha_chave_local}
evolution.api.instance=${EVOLUTION_API_INSTANCE:fluxbus}

# ===================== WHATSAPP - ASTRACALLS =====================
# AstraCalls (whatsmeow). Quando habilitado e configurado, atende as
# notificacoes automaticas; sem URL/API key/sessao o sistema cai para a
# Evolution (configuracao por empresa tem prioridade).
astracalls.api.enabled=${ASTRACALLS_API_ENABLED:false}
astracalls.api.url=${ASTRACALLS_API_URL:http://localhost:8090}
astracalls.api.key=${ASTRACALLS_API_KEY:}
astracalls.api.session-id=${ASTRACALLS_SESSION_ID:}

# ===================== OUTBOX DE WHATSAPP =====================
whatsapp.outbox.enabled=${WHATSAPP_OUTBOX_ENABLED:true}
whatsapp.outbox.poll-interval-ms=${WHATSAPP_OUTBOX_POLL_INTERVAL_MS:30000}
whatsapp.outbox.initial-delay-ms=${WHATSAPP_OUTBOX_INITIAL_DELAY_MS:15000}
whatsapp.outbox.batch-size=${WHATSAPP_OUTBOX_BATCH_SIZE:10}
whatsapp.outbox.max-attempts=${WHATSAPP_OUTBOX_MAX_ATTEMPTS:5}
whatsapp.outbox.retry-base-minutes=${WHATSAPP_OUTBOX_RETRY_BASE_MINUTES:2}
whatsapp.outbox.stuck-minutes=${WHATSAPP_OUTBOX_STUCK_MINUTES:10}
