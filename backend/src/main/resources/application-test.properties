# ====================================================
# CONFIGURAÇÃO DE TESTE - EVOLUTION API
# ====================================================
whatsapp.provider=evolution
evolution.api.enabled=true
evolution.api.url=http://localhost:8080
evolution.api.key=${EVOLUTION_API_KEY}
evolution.api.instance=test-fleetmanagem

# ===== WHATSAPP CLOUD API (DESABILITADO EM TESTE) =====
# Deixe desabilitado durante testes com Baileys
# Habilite quando migrar para produção
whatsapp.cloud.api.enabled=false
# whatsapp.cloud.api.url=https://graph.facebook.com/v18.0
# whatsapp.cloud.api.phone.number.id=SEU_PHONE_NUMBER_ID
# whatsapp.cloud.api.access.token=SEU_ACCESS_TOKEN
# whatsapp.cloud.api.waba.id=SEU_WABA_ID

# ===== DATABASE (usar H2 para testes se preferir) =====
# Ou mantenha PostgreSQL de desenvolvimento
spring.datasource.url=jdbc:postgresql://localhost:5432/fleetmanager_test
spring.datasource.username=postgres
spring.datasource.password=1234567

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000
jwt.header=Authorization
jwt.prefix=Bearer
jwt.refreshTokenExpiration=604800000

# ===== FLYWAY (para banco de teste existente) =====
# Flyway habilitado para executar migrations automaticamente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# Ignorar validação de checksum (desenvolvimento/teste)
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false

# ===== LOGS DETALHADOS =====
logging.level.com.z7design.fleet_manager.service.EvolutionApiService=DEBUG
logging.level.com.z7design.fleet_manager.service.EnvioService=DEBUG


# ===== CONFIGURAÇÃO DE EMAIL =====
# Email: securedguard@z7design.com.br
# Servidor: mail.z7design.com.br:465 (SSL/TLS)
spring.mail.host=${MAIL_HOST:186.209.113.105}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:securedguard@z7design.com.br}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2,TLSv1.3
# SocketFactory apenas para porta 465 - deixar vazio para porta 587
spring.mail.properties.mail.smtp.socketFactory.class=${MAIL_SOCKET_FACTORY:}
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_SOCKET_FACTORY_PORT:}
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:60000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:60000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:60000}
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
spring.mail.properties.mail.smtp.from=SecuredGuard <securedguard@z7design.com.br>

