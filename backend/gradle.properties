# ============================================
# Gradle Configuration
# ============================================

# Limitar concorrência para evitar rate-limit e bloqueio WAF 403 do Cloudflare / Maven Central
org.gradle.workers.max=2

# Custom User-Agent para evitar que Cloudflare bloqueie requisições do Gradle com 403 Forbidden
systemProp.http.agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
