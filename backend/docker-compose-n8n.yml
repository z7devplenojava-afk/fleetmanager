version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: fluxbus-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=fluxbus2024
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=your-secret-key-here
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - C:\n8n-data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    networks:
      - n8n-network

  wppconnect:
    image: wppconnect/wppconnect:latest
    container_name: fluxbus-wppconnect
    restart: unless-stopped
    ports:
      - "21465:21465"
    environment:
      - WPPCONNECT_SERVER_PORT=21465
      - WPPCONNECT_SERVER_HOST=0.0.0.0
      - WPPCONNECT_SERVER_SECRET=fluxbus-secret
      - WPPCONNECT_SERVER_TOKEN=fluxbus-token
    volumes:
      - wppconnect-data:/home/node/.wppconnect
    networks:
      - n8n-network

networks:
  n8n-network:
    driver: bridge

volumes:
  wppconnect-data: 