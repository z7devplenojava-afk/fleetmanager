[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetmanager-agents"
version = "1.0.0"
description = "FleetManager Intelligent Agent System for module monitoring and alerting"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["agents"]
include = ["agent_*", "core.*", "rag.*"]
