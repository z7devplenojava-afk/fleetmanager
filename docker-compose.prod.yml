version: '3.8'

# ============================================
# FLUXBUS - AMBIENTE PRODUÇÃO
# Nomenclatura: fluxbus-prod-*
# Portas: 5435 (DB), 6382 (Redis), 8086 (Backend), 3003 (Frontend), 3336 (WhatsApp)
# ⚠️  ATENÇÃO: Sempre use secrets e .env para senhas!
# ============================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: fluxbus-prod-db
    hostname: fluxbus-prod-db
    environment:
      POSTGRES_DB: fluxbus
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - fluxbus-prod-db-data:/var/lib/postgresql/data
      - ./seeds/schema:/docker-entrypoint-initdb.d/01-schema:ro
      - ./seeds/common:/docker-entrypoint-initdb.d/02-common:ro
      - ./seeds/prod:/docker-entrypoint-initdb.d/03-prod:ro
      - ./backups:/backups
    networks:
      - fluxbus-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d fluxbus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: fluxbus-prod-redis
    hostname: fluxbus-prod-redis
    ports:
      - "6382:6379"
    volumes:
      - fluxbus-prod-redis-data:/data
    networks:
      - fluxbus-prod-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    image: fluxbus-whatsapp:prod
    container_name: fluxbus-prod-whatsapp
    hostname: fluxbus-prod-whatsapp
    environment:
      PORT: 3333
      INSTANCE_KEY: fluxbus_db_prod
      SESSION_DIR: /app/sessions
      NODE_ENV: production
    volumes:
      - fluxbus-prod-whatsapp-sessions:/app/sessions
    ports:
      - "3336:3333"
    networks:
      - fluxbus-prod-network
    dns:
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: fluxbus-backend:prod
    container_name: fluxbus-prod-backend
    hostname: fluxbus-prod-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://fluxbus-prod-db:5432/fluxbus
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: fluxbus-prod-redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      BAILEYS_ENABLED: "true"
      BAILEYS_REST_URL: http://fluxbus-prod-whatsapp:3333
      JWT_SECRET: ${JWT_SECRET}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8086:8083"
    networks:
      - fluxbus-prod-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: fluxbus-frontend:prod
    container_name: fluxbus-prod-frontend
    hostname: fluxbus-prod-frontend
    environment:
      VITE_API_URL: https://fluxbus.com.br
      VITE_ENV: production
    ports:
      - "3003:80"
    networks:
      - fluxbus-prod-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fluxbus-prod-db-data:
    name: fluxbus-prod-db-data
  fluxbus-prod-redis-data:
    name: fluxbus-prod-redis-data
  fluxbus-prod-whatsapp-sessions:
    name: fluxbus-prod-whatsapp-sessions

networks:
  fluxbus-prod-network:
    name: fluxbus-prod-network
    driver: bridge





























